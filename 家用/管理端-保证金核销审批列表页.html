<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保证金核销审批（管理端）</title>
<style>
:root{
  --primary:#3b5998; --primary-light:#4a72c3;
  --text:#333; --text-secondary:#666; --text-aux:#999;
  --bg:#f5f6fa; --bg-header:#f8f9fb; --bg-hover:#f2f4f9;
  --border:#e0e3ea; --border-light:#eef0f4;
  --success:#52c41a; --warning:#faad14; --danger:#f5222d;
  --radius:6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:var(--text);background:var(--bg);}

/* ====== 页面框架 ====== */
.page{display:flex;flex-direction:column;height:100vh;min-width:1200px;}

.page-scroll{flex:1;overflow-y:auto;padding:16px 20px 80px;}

/* ====== 筛选区 ====== */
.filter-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;}
.filter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 24px;}
.filter-item{display:flex;align-items:center;gap:8px;min-width:0;}
.filter-item label{font-size:12px;color:var(--text-secondary);white-space:nowrap;flex-shrink:0;width:72px;text-align:right;}
.filter-item input,.filter-item select{height:30px;flex:1;border:1px solid var(--border);border-radius:4px;padding:0 10px;font-size:12px;color:var(--text);outline:none;transition:.15s;background:#fff;min-width:0;}
.filter-item input:focus,.filter-item select:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,89,152,.12);}
.filter-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border-light);}
.btn{height:32px;padding:0 22px;border-radius:4px;font-size:13px;cursor:pointer;transition:.15s;border:1px solid var(--border);background:#fff;color:var(--text-secondary);}
.btn:hover{border-color:var(--primary);color:var(--primary);}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
.btn-primary:hover{background:var(--primary-light);color:#fff;}

/* ====== 下拉多选（所属部门，演示：家用类型销售公司） ====== */
.ms{position:relative;flex:1;min-width:0;}
.ms-trigger{width:100%;height:30px;border:1px solid var(--border);border-radius:4px;background:#fff;padding:0 10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:12px;color:var(--text);outline:none;transition:.15s;}
.ms-trigger:hover{border-color:var(--primary);}
.ms-trigger.open{border-color:var(--primary);box-shadow:0 0 0 2px rgba(59,89,152,.12);}
.ms-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ms-caret{color:var(--text-aux);font-style:normal;font-size:10px;margin-left:6px;flex-shrink:0;}
.ms-panel{position:absolute;top:34px;left:0;z-index:60;min-width:100%;max-height:240px;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.14);padding:6px;}
.ms-opt{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:12px;white-space:nowrap;color:var(--text);}
.ms-opt:hover{background:var(--bg-hover);}
.ms .ms-opt input{height:14px;width:14px;margin:0;border:none;background:transparent;padding:0;flex:none;}

/* ====== 列表卡片 ====== */
.list-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius);overflow:hidden;}
.table-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;font-size:12px;min-width:1180px;}
.tbl th{background:var(--bg-header);color:var(--text-secondary);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:center;}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--border-light);text-align:center;white-space:nowrap;color:var(--text);}
.tbl tbody tr:hover{background:var(--bg-hover);}
.td-left{text-align:left!important;}
.td-strong{font-weight:600;}
.td-gray{color:var(--text-aux);}
.td-no{font-family:'Consolas',monospace;color:var(--primary);font-weight:600;}
/* 状态标签：沿用总部管理端 status 体系，主状态仅两态 */
.status{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11px;font-weight:600;}
.status-待审核{background:#E8F0FE;color:#3b5998;}
.status-已驳回{background:#FDECEC;color:#d9534f;}
.status-fms{background:#EDE9FE;color:#6d28d9;}

/* 操作列文字按钮 */
.op-link{color:var(--primary);cursor:pointer;margin:0 4px;font-size:12px;transition:.15s;}
.op-link:hover{text-decoration:underline;}
.op-link.disabled{color:var(--text-aux);cursor:not-allowed;text-decoration:none;}
.op-link.hidden{display:none;}

/* ====== 分页 ====== */
.pagination{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 16px;font-size:12px;color:var(--text-secondary);}
.page-btn{height:28px;min-width:28px;padding:0 8px;border:1px solid var(--border);border-radius:4px;background:#fff;cursor:pointer;color:var(--text-secondary);transition:.15s;}
.page-btn:hover:not(.disabled):not(.active){border-color:var(--primary);color:var(--primary);}
.page-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;}
.page-btn.disabled{color:var(--text-aux);cursor:default;}
.page-jump{display:flex;align-items:center;gap:4px;margin-left:6px;}
.page-jump input{width:46px;height:28px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:12px;outline:none;}

/* ====== 审批流程弹窗（3级示意节点，标注待定） ====== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal-content{width:560px;max-width:92vw;max-height:86vh;background:#fff;border-radius:8px;display:flex;flex-direction:column;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal-header{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-title{font-size:14px;font-weight:700;}
.modal-close{width:28px;height:28px;border-radius:50%;border:none;background:transparent;color:var(--text-aux);cursor:pointer;font-size:15px;}
.modal-close:hover{background:var(--bg-hover);color:var(--text);}
.modal-body{flex:1;overflow-y:auto;padding:18px 20px;}
.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:12px 16px;border-top:1px solid var(--border);flex-shrink:0;}

/* 竖向时间线（审批进度） */
.flow-timeline{position:relative;padding-left:26px;}
.flow-timeline::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--border-light);}
.flow-node{position:relative;padding:0 0 22px 0;}
.flow-node:last-child{padding-bottom:0;}
.flow-dot{position:absolute;left:-26px;top:2px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:var(--text-aux);}
.flow-dot.pass{background:var(--success);}
.flow-dot.reject{background:var(--danger);}
.flow-dot.wait{background:#fff;border:2px solid var(--text-aux);color:var(--text-aux);}
.flow-head{display:flex;align-items:center;gap:8px;}
.flow-stage{font-size:13px;font-weight:700;color:var(--text);}
.flow-role{font-size:11px;color:var(--text-aux);background:var(--bg);padding:1px 8px;border-radius:10px;}
.flow-result{margin-left:auto;font-size:12px;font-weight:600;}
.flow-result.pass{color:var(--success);}
.flow-result.reject{color:var(--danger);}
.flow-result.wait{color:var(--text-aux);}
.flow-meta{font-size:12px;color:var(--text-secondary);margin-top:4px;line-height:1.7;}
.flow-opinion{font-size:12px;color:var(--text);background:var(--bg);border-radius:4px;padding:6px 10px;margin-top:6px;line-height:1.6;}
.flow-note{font-size:11px;color:var(--warning);margin-top:14px;padding:8px 12px;background:#FFFBE6;border:1px solid #FFE58F;border-radius:4px;}

/* Toast */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.14);padding:10px 22px;font-size:13px;display:flex;align-items:center;gap:8px;opacity:0;transition:.25s;z-index:500;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast.success .t-icon{color:var(--success);}
.toast.error .t-icon{color:var(--danger);}
.toast.info .t-icon{color:var(--primary);}
</style>
</head>
<body>
<div class="page">

  <div class="page-scroll">

    <!-- ====== 筛选区（9 字段：方案编号/核销单号/所属部门/方案名称/项目类型/价格审批编号/SKU编码/核销状态/显示过滤；创建人、创建时间搜索已移除） ====== -->
    <div class="filter-card">
      <div class="filter-grid">
        <div class="filter-item"><label>方案编号</label><input id="fPlanNo" placeholder="如 GCTP2620260723001"></div>
        <div class="filter-item"><label>核销单号</label><input id="fNo" placeholder="如 BHX262026072300101"></div>
        <div class="filter-item"><label>所属部门</label>
          <div class="ms" id="msDept">
            <div class="ms-trigger" id="msDeptTrigger" onclick="msToggle('msDept')">
              <span class="ms-label" id="msDeptLabel">全部</span><i class="ms-caret">▾</i>
            </div>
            <div class="ms-panel" id="msDeptPanel"></div>
          </div>
        </div>
        <div class="filter-item"><label>方案名称</label><input id="fPlanName" placeholder="请输入"></div>
        <div class="filter-item"><label>项目类型</label>
          <select id="fProjType"><option value="">全部</option><option>特批项目</option><option>资源机项目</option></select>
        </div>
        <div class="filter-item"><label>价格审批编号</label><input id="fPriceNo" placeholder="请输入"></div>
        <div class="filter-item"><label>SKU编码</label><input id="fSku" placeholder="请输入"></div>
        <div class="filter-item"><label>核销状态</label>
          <select id="fStatus"><option value="">全部</option><option value="待审核">待审核</option><option value="已驳回">已驳回</option></select>
        </div>
        <div class="filter-item"><label>显示过滤</label>
          <select id="fShow"><option value="mine" selected>待我审批</option><option value="all">所有单据</option></select>
        </div>
      </div>
      <div class="filter-actions">
        <button class="btn" onclick="resetFilter()">重置</button>
        <button class="btn btn-primary" onclick="doFilter()">查询</button>
      </div>
    </div>

    <!-- ====== 列表卡片 ====== -->
    <div class="list-card">
      <div class="table-wrap">
        <table class="tbl">
          <thead><tr>
            <th style="width:48px;">序号</th><th>方案编号</th><th>核销单号</th><th>所属部门</th><th>方案名称</th>
            <th>项目类型</th><th>特批方案类型</th><th>核销状态</th><th>创建人</th><th>创建时间</th><th>操作</th>
          </tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
      <div class="pagination" id="pager"></div>
    </div>

  </div>
</div>

<!-- ====== 审批流程弹窗（3级示意节点，审批流未定，标注待定） ====== -->
<div class="modal-overlay" id="flowModal" onclick="if(event.target===this)closeFlow()">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">审批流程 · <span id="flowNo"></span></span>
      <button class="modal-close" onclick="closeFlow()">✕</button>
    </div>
    <div class="modal-body" id="flowBody"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeFlow()">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toastBox"><span class="t-icon" id="toastIcon">✓</span><span id="toastMsg"></span></div>

<script>
/* ==================== 演示数据（快照，承接总部管理端提交数据） ====================
   注：通过态单据不在此列表（用户确认：通过后移出列表）。
   演示覆盖：待审核 ×3 + 已驳回 ×1，共 4 条。 */

/* 审批权限开关：具备审批权限=展示操作列按钮；无权限=整列隐藏。演示默认 true。 */
const HAS_APPROVE_PERMISSION = true;

/* 当前登录用户（演示）：待我审批 = 单据为待审核 且 当前待审节点审批人为当前用户 */
const CURRENT_USER = '张伟';

const DATA = [
  {no:'BHX262026072300101', planNo:'GCTP2620260723001', dept:'珠海销售公司', planName:'珠海·华发水郡工程特批方案', projType:'特批项目', special:'配提机', priceNo:'PJ2026081001', sku:'SKU100234', status:'待审核', sub:'FMS', curApprover:'', creator:'陈晓明', time:'2026-08-10 14:20',
   flow:[{stage:'1',role:'总部业务组长',result:'pass',name:'张伟',time:'2026-08-10 15:00',opinion:'同意'},{stage:'2',role:'总部业务主管',result:'pass',name:'李强',time:'2026-08-10 16:00',opinion:'同意'},{stage:'3',role:'销司确认',result:'pass',name:'陈晓明',time:'2026-08-11 10:00',opinion:''},{stage:'4',role:'FMS财务审批',result:'wait',name:'',time:'',opinion:''}]},
  {no:'BHX262026072300102', planNo:'GCTP2620260723002', dept:'广州销售公司', planName:'广州·敏捷广场工程特批方案', projType:'特批项目', special:'资源机', priceNo:'PJ2026081102', sku:'SKU200187', status:'待审核', curApprover:'张伟', creator:'张磊', time:'2026-08-11 09:30',
   flow:[{stage:'1',role:'总部业务组长',result:'wait',name:'张伟',time:'',opinion:''},{stage:'2',role:'总部业务主管',result:'wait',name:'',time:'',opinion:''},{stage:'3',role:'销司确认',result:'wait',name:'',time:'',opinion:''},{stage:'4',role:'FMS财务审批',result:'wait',name:'',time:'',opinion:''}]},
  {no:'BHX262026072300103', planNo:'GCZY2620260723003', dept:'东莞销售公司', planName:'东莞·松湖工程特批方案', projType:'资源机项目', special:'特价机', priceNo:'PJ2026081203', sku:'SKU300456', status:'待审核', curApprover:'李强', creator:'李伟', time:'2026-08-12 11:05',
   flow:[{stage:'1',role:'总部业务组长',result:'wait',name:'李强',time:'',opinion:''},{stage:'2',role:'总部业务主管',result:'wait',name:'',time:'',opinion:''},{stage:'3',role:'销司确认',result:'wait',name:'',time:'',opinion:''},{stage:'4',role:'FMS财务审批',result:'wait',name:'',time:'',opinion:''}]},
  {no:'BHX262026072300104', planNo:'GCTP2620260723004', dept:'佛山销售公司', planName:'佛山·岭南工程特批方案', projType:'特批项目', special:'配提机', priceNo:'PJ2026080904', sku:'SKU100998', status:'已驳回', curApprover:'', creator:'王芳', time:'2026-08-09 16:10',
   reason:'合格数量与质检报告不符，请核对后重新提交',
   flow:[{stage:'1',role:'总部业务组长',result:'reject',name:'王强',time:'2026-08-09 17:02',opinion:'合格数量与质检报告不符，请核对后重新提交'},{stage:'2',role:'总部业务主管',result:'wait',name:'',time:'',opinion:''},{stage:'3',role:'销司确认',result:'wait',name:'',time:'',opinion:''},{stage:'4',role:'FMS财务审批',result:'wait',name:'',time:'',opinion:''}]},
];

const PAGE_SIZE = 10;
/* 「显示过滤」：mine=待我审批（默认），all=所有单据 */
function filterByShow(d, show){
  if(show==='all') return true;
  return d.status==='待审核' && d.curApprover===CURRENT_USER;
}
let filtered = DATA.filter(d=>filterByShow(d,'mine'));
let curPage = 1;

/* ==================== 渲染表格 ==================== */
function renderList(){
  const body = document.getElementById('listBody');
  const start = (curPage-1)*PAGE_SIZE;
  const rows = filtered.slice(start, start+PAGE_SIZE);
  if(rows.length===0){
    body.innerHTML = '<tr><td colspan="11" class="td-gray" style="padding:30px;">无匹配单据</td></tr>';
    renderPager(1);
    return;
  }
  body.innerHTML = rows.map((d,idx)=>{
    return `<tr>
      <td>${start + idx + 1}</td>
      <td class="td-left td-gray">${d.planNo}</td>
      <td class="td-no">${d.no}</td>
      <td>${d.dept}</td>
      <td class="td-left td-strong">${d.planName}</td>
      <td>${d.projType}</td>
      <td>${d.special}</td>
      <td>${d.sub==='FMS' ? '<span class="status status-fms">审批中（FMS）</span>' : '<span class="status status-'+d.status+'">'+d.status+'</span>'}</td>
      <td>${d.creator}</td>
      <td class="td-gray">${d.time}</td>
      <td>${HAS_APPROVE_PERMISSION ? (d.sub==='FMS' ? '' : `<span class="op-link" onclick="goApprove('${d.no}')">审核</span>`) + `<span class="op-link" onclick="goView('${d.no}'${d.sub==='FMS' ? ",'FMS'" : ''})">查看</span><span class="op-link" onclick="openFlow('${d.no}')">审批流程</span>` : '<span class="td-gray">—</span>'}</td>
    </tr>`;
  }).join('');
  renderPager(Math.ceil(filtered.length/PAGE_SIZE));
}

/* ==================== 分页 ==================== */
function renderPager(totalPages){
  const pager = document.getElementById('pager');
  let html = '<button class="page-btn'+(curPage===1?' disabled':'')+'" onclick="gotoPage('+(curPage-1)+')">上一页</button>';
  for(let i=1;i<=totalPages;i++){
    html += '<button class="page-btn'+(i===curPage?' active':'')+'" onclick="gotoPage('+i+')">'+i+'</button>';
  }
  html += '<button class="page-btn'+(curPage===totalPages?' disabled':'')+'" onclick="gotoPage('+(curPage+1)+')">下一页</button>';
  html += '<span class="page-jump">跳至 <input id="jumpInput" type="text" value="'+curPage+'"> 页</span>';
  pager.innerHTML = html;
}
function gotoPage(p){
  const total = Math.ceil(filtered.length/PAGE_SIZE) || 1;
  curPage = Math.max(1, Math.min(p, total));
  renderList();
}

/* ==================== 筛选 ==================== */
function doFilter(){
  const kw = {
    planNo:document.getElementById('fPlanNo').value.trim().toLowerCase(),
    no:document.getElementById('fNo').value.trim().toLowerCase(),
    planName:document.getElementById('fPlanName').value.trim().toLowerCase(),
    projType:document.getElementById('fProjType').value,
    priceNo:document.getElementById('fPriceNo').value.trim().toLowerCase(),
    sku:document.getElementById('fSku').value.trim().toLowerCase(),
    status:document.getElementById('fStatus').value,
    show:document.getElementById('fShow').value,
  };
  filtered = DATA.filter(d=>{
    if(kw.planNo && !d.planNo.toLowerCase().includes(kw.planNo)) return false;
    if(kw.no && !d.no.toLowerCase().includes(kw.no)) return false;
    if(selectedDepts.length && !selectedDepts.includes(d.dept)) return false;
    if(kw.planName && !d.planName.toLowerCase().includes(kw.planName)) return false;
    if(kw.projType && d.projType!==kw.projType) return false;
    if(kw.priceNo && !(d.priceNo||'').toLowerCase().includes(kw.priceNo)) return false;
    if(kw.sku && !(d.sku||'').toLowerCase().includes(kw.sku)) return false;
    if(kw.status && d.status!==kw.status) return false;
    if(!filterByShow(d, kw.show)) return false;
    return true;
  });
  curPage = 1;
  renderList();
}
function resetFilter(){
  ['fPlanNo','fNo','fPlanName','fPriceNo','fSku'].forEach(id=>document.getElementById(id).value='');
  selectedDepts = [];
  document.getElementById('msDeptLabel').textContent = '全部';
  msRenderDept();
  ['fProjType','fStatus'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('fShow').value = 'mine';
  filtered = DATA.filter(d=>filterByShow(d,'mine')); curPage = 1; renderList();
}

/* ==================== 操作跳转 ==================== */
function goApprove(no){ location.href = '管理端-保证金核销审批页.html?no=' + encodeURIComponent(no); }
function goView(no, sub){ location.href = '管理端-保证金核销审批页_查看版.html?no=' + encodeURIComponent(no) + (sub==='FMS' ? '&stage=fms' : ''); }

/* ==================== 审批流程弹窗 ==================== */
function openFlow(no){
  const d = DATA.find(x=>x.no===no);
  if(!d) return;
  document.getElementById('flowNo').textContent = no;
  const dotClass = {pass:'pass',reject:'reject',wait:'wait'};
  const resText = {pass:'已通过',reject:'已驳回',wait:'待审核'};
  document.getElementById('flowBody').innerHTML =
    '<div class="flow-timeline">' +
    d.flow.map(n=>`
      <div class="flow-node">
        <span class="flow-dot ${dotClass[n.result]}">${n.result==='pass'?'✓':n.result==='reject'?'×':'·'}</span>
        <div class="flow-head">
          <span class="flow-stage">第${n.stage}级审批</span>
          <span class="flow-role">${n.role}</span>
          <span class="flow-result ${n.result}">${resText[n.result]}</span>
        </div>
        ${n.name?`<div class="flow-meta">审批人：${n.name}${n.time?'　·　'+n.time:''}</div>`:''}
        ${n.opinion?`<div class="flow-opinion">审批意见：${n.opinion}</div>`:''}
      </div>`).join('') +
    '</div>' +
    '<div class="flow-note">⚠️ 审批流程：总部业务组长 → 总部业务主管 → 销司确认 → FMS 财务审批（销司仅通过、7 天未审自动通过；FMS 结果回传）。</div>';
  document.getElementById('flowModal').classList.add('show');
}
function closeFlow(){ document.getElementById('flowModal').classList.remove('show'); }

/* ==================== Toast ==================== */
function toast(msg, type){
  const box = document.getElementById('toastBox');
  document.getElementById('toastMsg').textContent = msg;
  document.getElementById('toastIcon').textContent = type==='error'?'✕':type==='info'?'ℹ':'✓';
  box.className = 'toast show ' + (type||'success');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>box.classList.remove('show'), 2800);
}

/* ==================== 所属部门 下拉多选（演示：家用类型销售公司） ==================== */
const DEPT_OPTIONS = ['珠海销售公司','广州销售公司','东莞销售公司','佛山销售公司','中山销售公司','江门销售公司','惠州销售公司','肇庆销售公司'];
let selectedDepts = []; // 空数组 = 全部
function msRenderDept(){
  const panel = document.getElementById('msDeptPanel');
  panel.innerHTML = DEPT_OPTIONS.map(o=>`<label class="ms-opt"><input type="checkbox" value="${o}" onchange="msDeptChange()" ${selectedDepts.includes(o)?'checked':''}> ${o}</label>`).join('');
}
function msToggle(id){
  const panel = document.getElementById(id+'Panel');
  const trigger = document.getElementById(id+'Trigger');
  const willOpen = panel.style.display!=='block';
  document.querySelectorAll('.ms-panel').forEach(p=>p.style.display='none');
  document.querySelectorAll('.ms-trigger').forEach(t=>t.classList.remove('open'));
  if(willOpen){ panel.style.display='block'; trigger.classList.add('open'); }
}
function msDeptChange(){
  selectedDepts = Array.from(document.querySelectorAll('#msDeptPanel input:checked')).map(c=>c.value);
  document.getElementById('msDeptLabel').textContent = selectedDepts.length ? ('已选 '+selectedDepts.length+' 项') : '全部';
  doFilter();
}
document.addEventListener('click', function(e){
  if(!e.target.closest('.ms')){
    document.querySelectorAll('.ms-panel').forEach(p=>p.style.display='none');
    document.querySelectorAll('.ms-trigger').forEach(t=>t.classList.remove('open'));
  }
});

/* ==================== 初始化 ==================== */
msRenderDept();
renderList();
</script>
