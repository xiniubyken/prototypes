<!DOCTYPE html>
<!--
  【2026-10-17 修订 · 工程返利字段（新增，与 PC 管理端-批价单详情.html 同口径）】
  1. 设备卡片**不展示**「返利比例上限」；改为点击商品 → 商品详情弹层内展示（仅 full 模式：待提货/部分提货/已完结/已关闭）
  2. 设备清单汇总区新增「已使用返利：¥x」（整单口径，数据 d.usedRebate）—— **仅待提货/部分提货/已完结/已关闭展示，审批中系列与已驳回不展示**（订单尚未支付）
  3. 状态「待提货 / 部分提货」底部操作栏新增按钮「工程返利参数配置」→ **居中弹窗**逐行配置返利比例上限（必填、0~100）
     —— 2026-10-20 已按需求移除该底部按钮（弹窗与配置逻辑保留，返利比例上限改为仅展示）
  4. 【修正】设备卡片点击事件原为 onclick="openProd(list.indexOf(e))"，list/e 是 renderDevices() 局部变量、内联 onclick 在全局作用域求值 → ReferenceError，弹层打不开；已改为 openProd(索引变量 idx)
  5. 【修正】商品详情弹层字段对齐 PC 设备清单列（full 15 项 / simple 8 项；商品名称在弹层标题区展示，不重复列）
  6. 【修正】非标商品同样有批复比例：DEV_APPROVED 中「定制机-非标控制柜」rpoint / rebateLimit 由 null 补为 6.5（待提货/部分提货/已完结/已关闭均生效），弹层不再显示「—」
  7. 【演示调整】非标商品「定制机-非标控制柜」由第 5 条前移至第 3 条 —— 设备清单默认只展示前 3 条，
     前移后无需点「展示全部」即可看到非标标识（与 PC 表格顺序有意不同，PC 仍为第 5 行）；
     同时 DEV_PENDING / DEV_APPROVED 两套数据一致调整，devOf() 的购买/发货数量数组已按新索引同步重排
  说明：NEW 角标仅标识本次新增范围，非 UI 需求。
-->

function openProd(idx){
  const d=STATES[curKey];
  const e=(d.devices||[])[idx];if(!e)return;
  const full=true;
  /* 【修正 · 2026-10-17】字段口径对齐 PC 端设备清单 full / simple 两套列，顺序与 PC 表头一致
     （商品名称已在弹层标题区展示，此处不重复；品类按同类页面惯例在标题区标签 + 字段行各出现一次） */
  let rows=[['品类',e.cate||'—'],['型号',e.model],['SKU编码',e.code],['商品ID',e.id]];
  rows.push(['申请数量',e.qty]);
  rows.push(['申请价格',money2(e.price)]);
  rows.push(['申请点位',e.point||'—']);
  rows.push(['批复价格',e.approve!=null?money2(e.approve):'待绑定商品后填写']);
  rows.push(['权限区间',e.rightRange||'—']);
  rows.push(['批复点位',e.rpoint!=null?e.rpoint+'%':'—']);
  rows.push(['定金比例',(e.depositRate||0)+'%']);
  rows.push(['返利比例上限',(e.rebateLimit!=null?e.rebateLimit+'%':'—')]);
  rows.push(['网批挂网价',e.online!=null?money2(e.online):'—']);
  rows.push(['预估价',e.estimate!=null?money2(e.estimate):(e.nonstd?'待绑定商品后填写':'--')]);
  rows.push(['备注',e.remark||'—']);
  var head='<div class="pd2-head"><div class="pd2-thumb">'+IMG_SVG+'</div><div style="min-width:0">'

    +(e.cate?'<div class="pd2-cate">'+esc(e.cate)+'</div>':'')
    +'</div></div>';
  var body=head+'<div class="pd2-rows">'+rows.map(function(r){
    /* 【新增 · 2026-10-17】返利比例上限行带 NEW 角标 */
    var isNew=(String(r[0])==='返利比例上限');

  }).join('')+'</div>';
  document.getElementById('prodBody').innerHTML=body;
  document.getElementById('prodMask').classList.add('on');
}
