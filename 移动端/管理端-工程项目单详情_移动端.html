   ============================================================ */
function render(){
  var s = current();
  var sc = STATUS_COLOR[s.status] || STATUS_COLOR["审批中"];

  /* 摘要 tags：业务线 + 子状态（设计稿：子状态 tag 随状态） */
  var tags = '<span class="tag">'+esc(BIZ_TAG)+'</span>' + (s.tag ? '<span class="tag blue">'+esc(s.tag)+'</span>' : '');
  document.getElementById("summaryTags").innerHTML = tags;

  /* 有效期/驳回有效期条（仅部分状态，含日期区间；已驳回=驳回有效期） */
  var ex = document.getElementById("expiry");
  if(s.expiry){
    ex.textContent = expiryTxt(s.expiry);
    ex.style.display="block";
  } else { ex.textContent=""; ex.style.display="none"; }

  /* 驳回原因条（已驳回；PC rejectReason） */
  var rej = document.getElementById("rejectBox");
  if(s.reject){
    rej.innerHTML = esc(s.reject) + '<div class="time">'+esc(s.rejectTime||"")+'</div>';
    rej.style.display="block";
  } else { rej.innerHTML=""; rej.style.display="none"; }

  /* 设备清单（设计稿：默认 3 台，展开 5 台；全普通无"非"标；合计卡底） */
  renderEquip();
  renderEquipToggle();

  /* 使用方信息：13 项；跨区类型/编号随状态；项目名称行可复制（人定④） */
  var uMap = {};
  Object.keys(USAGE_FIXED).forEach(function(k){ uMap[k]=USAGE_FIXED[k]; });
  var urows = USAGE_ORDER.map(function(k){
    if(k==="项目名称") return kvRow(k, uMap[k]||"—", "doCopyName");
    if(k==="跨区类型") return kvRow(k, s.cr.type, null);
    if(k==="跨区编号") return kvRow(k, (s.cr.code ? s.cr.code : "—"), null);
    return kvRow(k, uMap[k] || "—", null);
  });
  document.getElementById("usageKv").innerHTML = urows.join("");

  /* 基本信息：项目单号(+复制)、登录顺序(行内展示，无查看入口)、登录时间、经销商…（PC 字段） */
  var b = [
    ["项目单号", TITLE, "doCopyProject"],
    ["登录顺序", s.lo ? s.lo.seq+"-"+s.lo.order : "—", null],
    ["登录时间", "2026-06-25 10:30", null],
    ["经销商名称", "家经部观察正式环境账号", null],
    ["经销商电话", "137 1234 5678", null],
    ["业务线", BIZ_TAG, null]
  ];
  document.getElementById("basicKv").innerHTML = b.map(function(r){
    return kvRow(r[0], r[1], r[2]);
  }).join("");

  /* 状态子区块（中标/签单/丢标；PC ext） */
  document.getElementById("stateExtra").innerHTML = renderExtra(s.extra);

  /* 审批进度：审批单据卡（PC al） */
  var apl = APPROVALS[currentKey] || [];
  document.getElementById("progressCards").innerHTML = apl.length
    ? apl.map(apCardHtml).join("")
    : '<div class="ap-empty">暂无记录</div>';

  /* 关联批价单（PC pl；空=空态） */
  var rel = (s.related==="pj") ? (REL_CARDS[currentKey] || []) : [];
  document.getElementById("priceList").innerHTML = rel.length
    ? rel.map(pjCardHtml).join("")
    : '<div class="ap-empty">暂无关联批价单</div>';

  /* 底部：左状态徽章（点开切换），右按钮按状态（单动作直显 / 多动作=操作⌄ / 无则隐藏） */
  var fs = document.getElementById("footerState");
  fs.textContent = s.status;
  fs.style.background = sc[0];
  fs.style.color = sc[1];
  var fb = document.getElementById("footerButton");
  if(s.actions && s.actions.length){
    fb.textContent = "操作"; fb.className = "footer-btn"; fb.style.display = "";
  } else if(s.direct){
    fb.textContent = s.direct; fb.className = "footer-btn no-arrow alert"; fb.style.display = "";
  } else {
    fb.style.display = "none";
  }

  document.getElementById("stateSelect").value = currentKey;
  document.querySelectorAll(".section").forEach(function(el){ el.classList.remove("collapsed"); });
}

/* 设备清单 */
function renderEquip(){
  var list = equipExpanded ? baseProducts : baseProducts.slice(0, EQUIP_SHOW);
  document.getElementById("equipList").innerHTML = list.map(function(p,i){
    var realIdx = baseProducts.indexOf(p);
    return '<div class="equip" onclick="openPd(\''+realIdx+'\')">'
      + '<div class="product-img">'+PD_IMG+'</div>'
      + '<div class="equip-main">'
      + '<div class="equip-name">'+esc(p.name)+'</div>'
      + '<div class="equip-sku">'+esc(p.listSku)+'</div>'
      + '<div class="equip-bottom"><span class="price-lbl">申请价格：'+esc(p.price)+'</span><span class="qty">'+esc(p.qty)+'</span></div>'
      + '<span class="go">›</span></div></div>';
  }).join("");
}
function renderEquipToggle(){
  var tg = document.getElementById("equipToggle");
  if(baseProducts.length > EQUIP_SHOW){
    tg.style.display = "flex";
    tg.innerHTML = equipExpanded ? "收起全部<span class='chevron' style='margin:0;transform:rotate(225deg)'></span>" : "展示全部<span class='chevron' style='margin:0'></span>";
    tg.onclick = function(){ equipExpanded = !equipExpanded; render(); };
  } else { tg.style.display = "none"; tg.onclick = null; }
  document.getElementById("equipTotals").innerHTML = '<div>总套数：<strong>43 套</strong></div><div>总申请金额：<span class="amount">¥198,500.00</span></div>';
}

function kvRow(k, v, fn){
  var val;
  if(fn){
    val = '<div class="row-value"><span>'+esc(v)+'</span><span class="action" onclick="'+fn+'()">复制</span></div>';
  } else {
    val = '<div class="v">'+esc(v)+'</div>';
  }
  return '<div class="k">'+esc(k)+'</div>'+val;
}

/* ---- 状态子区块（PC ext） ---- */
function fileHtml(name){ return '<div class="file"><span class="pdf"></span><span class="file-name">'+esc(name)+'</span><span class="file-ops"><span onclick="toast(\'原型占位：预览文件\')">预览</span><span onclick="toast(\'原型占位：删除文件\')">删除</span></span></div>'; }
function renderExtra(type){
  if(type==="bid") return '<div class="sub-block"><div class="sub-block-title">中标信息</div><div style="color:#888;font-size:14px;margin-bottom:8px">中标通知书</div>'+fileHtml("中标通知书_XX商业综合体.pdf")+'</div>';
  if(type==="sign") return '<div class="sub-block"><div class="sub-block-title">中标信息</div><div style="color:#888;font-size:14px;margin-bottom:8px">中标通知书</div>'+fileHtml("中标通知书_XX商业综合体.pdf")+'</div><div class="sub-block"><div class="sub-block-title">签单信息</div><div style="color:#888;font-size:14px;margin-bottom:8px">合同附件</div>'+fileHtml("合同附件_XX商业综合体.pdf")+'<div class="kv" style="margin-top:12px"><div class="k">合同客户</div><div class="v">XX商业管理有限公司</div><div class="k">签单金额</div><div class="v">¥480,000</div></div></div>';
  if(type==="lost") return '<div class="sub-block"><div class="sub-block-title">丢标信息</div><div class="kv" style="margin-bottom:8px"><div class="k">丢单原因</div><div class="v">价格原因</div></div><div style="color:#888;font-size:14px;margin-bottom:8px">丢单报告</div>'+fileHtml("丢单报告_XX商业综合体.pdf")+'</div>';
  return "";
}

/* ---- 审批进度单据卡 ---- */
function apPillCls(st){ return st==="审批中"?"sp":(st==="通过"?"ok":(st==="驳回"?"rj":"cc")); }
function apCardHtml(a){
  var canResub = (current().status==="已驳回") && a.type==="登录审批" && a.status==="驳回";
  var act = '<span class="ap-link" onclick="openAf(\''+a.type+'\')">审批流程</span>';
  if(canResub) act = '<span class="ap-link rj" onclick="toast(\'原型占位：跳转驳回重提\')">重新提交</span>' + act;
  return '<div class="ap-card">'
    + '<div class="ap-hd"><span class="ap-type">'+esc(a.type)+'</span><span class="ap-pill '+apPillCls(a.status)+'">'+esc(a.status)+'</span></div>'
    + '<div class="ap-line"><span class="l">更新时间：</span><span class="v">'+esc(a.updated)+'</span></div>'
    + '<div class="ap-line"><span class="l">创建时间：</span><span class="v">'+esc(a.created)+'</span></div>'
    + '<div class="ap-act">'+act+'</div></div>';
}
/* 审批流程 SVG（示意占位图，设计稿：流程图以图片呈现，点击可放大） */
function afFlowSvg(){
  var nodes=[
    {t:"经销商提交",c:"#28b978",st:"完成"},
    {t:"一级审批人",c:"#28b978",st:"完成"},
    {t:"二级审批人",c:"#0868d7",st:"当前"},
    {t:"完成",c:"#c9ced6",st:""}
  ];
  var H = nodes.length*96 + 20;
  var p=['<svg viewBox="0 0 300 '+H+'" xmlns="http://www.w3.org/2000/svg"><defs><marker id="afArr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ccd2da"/></marker></defs>'];
  nodes.forEach(function(n,i){
    var y=8+i*96;
    p.push('<rect x="62" y="'+y+'" width="176" height="54" rx="10" fill="#fff" stroke="'+n.c+'" stroke-width="2"/>');
    p.push('<text x="150" y="'+(y+22)+'" text-anchor="middle" font-size="13" fill="#333" font-weight="600">'+n.t+'</text>');
    if(n.st){ p.push('<text x="150" y="'+(y+41)+'" text-anchor="middle" font-size="11" fill="'+n.c+'">'+n.st+'</text>'); }
    if(i<nodes.length-1){ p.push('<line x1="150" y1="'+(y+54)+'" x2="150" y2="'+(y+84)+'" stroke="#ccd2da" stroke-width="2" marker-end="url(#afArr)"/>'); }
  });
  p.push('</svg>');
  return p.join("");
}
function openAf(type){
  document.getElementById("afTitle").textContent = "审批流程"+(type?"·"+type:"");
  document.getElementById("afFlowBody").innerHTML =
    '<div class="af-flow" onclick="openZoom()">'+afFlowSvg()+'<div class="af-flow-note">流程图占位图 · 点击可放大</div></div>';
  document.getElementById("afNodeBody").innerHTML = '<div class="af-node-type">节点类型：岗位</div>'
    + AF_NODES.map(function(n){
      return '<div class="af-node"><div class="n1">岗位编号 <b>'+esc(n.code)+'</b> · 岗位名称：'+esc(n.name)+'</div><div class="n2">'+esc(n.emp)+'</div></div>';
    }).join("");
  afTab(document.querySelector('#afMask [data-aft="flow"]'), "flow");
  document.getElementById("afMask").classList.add("show");
}
function openZoom(){
  document.getElementById("zoomBody").innerHTML = afFlowSvg();
  document.getElementById("zoomWrap").classList.add("show");
}
function closeZoom(e){
  var z = document.getElementById("zoomWrap");
  if(e && e.target !== z && e.target.id !== "zoomClose") return;
  z.classList.remove("show");
}
function closeAf(e){ if(e && e.target !== document.getElementById("afMask")) return; document.getElementById("afMask").classList.remove("show"); }
function afTab(btn, which){
  document.querySelectorAll("#afMask .af-seg button").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  document.getElementById("afFlowBody").style.display = which==="flow" ? "" : "none";
  document.getElementById("afNodeBody").style.display = which==="node" ? "" : "none";
}

/* ---- 关联批价单卡片 ---- */
function pjRowHtml(card, r, ci, ri){
  var priceTxt = r.approve!=null ? '<span class="v">¥'+r.approve.toLocaleString()+'</span>' : '<span class="na">待批复</span>';
  return '<div class="pj-row" onclick="openPjRow(\''+card.id+'\','+ci+','+ri+')">'
    + '<div class="pj-mini">'+PD_IMG+'</div>'
    + '<div class="pj-main">'
    + '<div class="pj-r1"><div class="pj-name"><span class="cate">'+esc(r.cate)+'</span>'+esc(r.name)+'</div><span class="pj-count">×'+r.qty+'</span></div>'
    + '<div class="pj-sku">'+esc(r.sku)+'</div>'
    + '<div class="pj-price">批复价格：'+priceTxt+'</div>'
    + '</div></div>';
}
function pjCardHtml(card, ci){
  var c = pjPillCss(card.status);
  var open = !!PJ_OPEN[card.id];
  var shown = open ? card.rows : card.rows.slice(0,2);
  var totalQty = card.rows.reduce(function(s,r){ return s+r.qty; },0);
  var hasApprove = card.rows.some(function(r){ return r.approve!=null; });
  var totalApp = card.rows.reduce(function(s,r){ return s+((r.approve!=null)?r.approve*r.qty:0); },0);
  var rowsHtml = shown.map(function(r,ri){ return pjRowHtml(card,r,ci,ri); }).join("");
  var toggle = card.rows.length>2
    ? '<div class="pj-toggle" onclick="pjToggle(\''+card.id+'\')">'+(open?"收起":"展开")+'<span class="chevron" style="margin:0"></span></div>'
    : '';
  return '<div class="pj-card">'
    + '<div class="pj-hd"><span class="pj-id" onclick="toast(\'原型占位：打开批价单详情\')">'+esc(card.id)+'</span>'
    + '<span class="pj-right"><span class="ap-pill '+pjPillCls(card.status)+'" style="background:'+c[0]+';color:'+c[1]+'">'+esc(card.status)+'</span><span class="pj-arrow" onclick="toast(\'原型占位：打开批价单详情\')">›</span></span></div>'
    + '<div class="pj-rows">'+rowsHtml+'</div>'
    + toggle
    + '<div class="pj-sum">'
    + '<span><span class="k">业务线：</span><span class="v">'+esc(card.biz)+'</span></span>'
    + '<span><span class="k">总申请数量：</span><span class="v">'+totalQty+' 台</span></span>'
    + '<span><span class="k">总批复金额：</span>'+(hasApprove?'<span class="v amt">¥'+totalApp.toLocaleString()+'</span>':'<span class="v na">待批复</span>')+'</span>'
    + '</div></div>';
}
function pjToggle(id){ PJ_OPEN[id]=!PJ_OPEN[id]; renderRelatedOnly(); }
function renderRelatedOnly(){
  var s = current();
  var rel = (s.related==="pj") ? (REL_CARDS[currentKey] || []) : [];
  document.getElementById("priceList").innerHTML = rel.length
    ? rel.map(pjCardHtml).join("")
    : '<div class="ap-empty">暂无关联批价单</div>';
}
function openPjRow(id, ci, ri){
  var card = (REL_CARDS[currentKey]||[])[ci];
  if(!card || !card.rows[ri]) return;
  var r = card.rows[ri];
  var fields = [
    ["SKU编码", r.sku],["商品ID", r.id||"—"],["申请数量", r.qty],["申请价格", "¥"+r.price.toLocaleString()],
    ["批复价格", r.approve!=null ? "¥"+r.approve.toLocaleString() : "待批复"],
    ["预估价", "¥"+r.estimate.toLocaleString()],["定金比例", r.deposit+"%"],["网批挂价", "¥"+r.online.toLocaleString()],
    ["购买数量", r.buy],["发货数量", r.ship],["备注", r.remark]
  ];
  showPdCard(r.cate, r.name, fields);
}
function showPdCard(cate, name, fields){
  var html = '<div class="pd-card">'
    + '<div class="pd-head">'
    + '<div class="pd-img">'+PD_IMG+'</div>'
    + '<div style="min-width:0"><div class="pd-name">'+esc(name)+'</div><span class="pd-cate">'+esc(cate)+'</span></div>'
    + '</div><div class="pd-fields">'
    + fields.map(function(f){ return '<div class="pd-row'+(f[0]==="备注"?" remark":"")+'"><span class="l">'+esc(f[0])+'</span><span class="r">'+esc(f[1])+'</span></div>'; }).join("")
    + '</div></div>'
    + '<div class="pd-foot"><button class="pd-ok" onclick="closePd()">确定</button></div>';
  document.getElementById("pdBody").innerHTML = html;
  document.getElementById("pdMask").classList.add("show");
}

/* ---- 商品详情弹层（详情页设备卡；字段=品类/名称/SKU码/商品ID/型号/申请数量/申请价格/申请点位/备注） ---- */
var PD_IMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M4 17l4.5-4 3 3L16 12l4 4"/></svg>';
function openPd(i){
  var p = baseProducts[+i];
  if(!p) return;
  var fields = [
    ["SKU编码", p.sku],["商品ID", p.id],["型号", p.model],
    ["申请数量", p.qtyVal],["申请价格", p.price],["申请点位", p.point],["备注", p.remark]
  ];
  showPdCard(p.cate, p.name, fields);
}
function closePd(e){ if(e && e.target !== document.getElementById("pdMask")) return; document.getElementById("pdMask").classList.remove("show"); }

/* ============================================================
   交互
   ============================================================ */
function switchPanel(id, el){
  document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
  document.querySelectorAll(".panel").forEach(function(x){ x.classList.remove("active"); });
  el.classList.add("active");
  document.getElementById(id+"Panel").classList.add("active");
  window.scrollTo(0,0);
}
function toggleSection(id){ document.getElementById(id).classList.toggle("collapsed"); }

/* 复制（人定：项目名称/项目单号行均可复制） */
function copyText(txt){
  var ok=false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); ok=true; }
  }catch(e){}
  toast(ok ? "已复制："+txt : "已复制："+txt);
}
function doCopyProject(){ copyText(TITLE); }
function doCopyName(){ copyText("名称名称名称名称名称名称名称"); }

/* 右上角 ⋯ 更多（骨架与用户端一致；菜单项按 PC/设计稿语义定） */
function toggleMoreMenu(e){
  if(e){ e.stopPropagation(); }
  document.getElementById("moreMenu").classList.toggle("on");
}
function closeMoreMenu(){ document.getElementById("moreMenu").classList.remove("on"); }
function moreCopyProject(){ closeMoreMenu(); doCopyProject(); }
document.addEventListener("click", function(e){
  var m = document.getElementById("moreMenu");
  if(!m || !m.classList.contains("on")) return;
  if(e.target.closest && e.target.closest("#moreMenu")) return;
  if(e.target.id === "moreBtn") return;
  m.classList.remove("on");
});

/* 底部按钮：多动作 → 操作⌄ 弹层；单动作(作废) → 直开对应流程 */
function handleFooter(){
  var s = current();
  if(s.actions && s.actions.length){ openMore(); return; }
  if(s.direct){ doDirect(s.direct); return; }
}
function openMore(){
  var s = current();
  var html = (s.actions||[]).map(function(a){
    var cls = a==="作废" ? "danger" : "outline";
    return '<button class="sheet-btn '+cls+'" onclick="doAction(\''+a.replace(/'/g,"\\'")+'\')">'+a+'</button>';
  }).join("");
  document.getElementById("sheetList").innerHTML = html;
  document.getElementById("sheetMask").classList.add("show");
}
function closeSheet(e){ if(e && e.target !== document.getElementById("sheetMask")) return; document.getElementById("sheetMask").classList.remove("show"); }
function doAction(a){ closeSheet(); toast("原型占位："+a); }
function doDirect(a){ toast("原型占位："+a); }

/* 状态切换（左上角调试 + 底部状态点按） */
function openStatePicker(){
  document.getElementById("stateOptions").innerHTML = stateOrder.map(function(k){
    return '<button class="state-option '+(k===currentKey?"current":"")+'" onclick="setState(\''+k.replace(/'/g,"\\'")+'\')">'+esc(k)+'</button>';
  }).join("");
  document.getElementById("statePicker").classList.add("show");
}
function closeStatePicker(e){ if(e && e.target !== document.getElementById("statePicker")) return; document.getElementById("statePicker").classList.remove("show"); }

function setState(key){
  if(!STATES[key]) key = DEFAULT_KEY;
  currentKey = key;
  equipExpanded = false;
  PJ_OPEN = {};
  closeStatePicker();
  closeSheet();
  closePd();
  closeAf();
  document.getElementById("stateSelect").value = key;
  if(location.hash !== "#"+encodeURIComponent(key)){ history.replaceState(null,"","#"+encodeURIComponent(key)); }
  render();
  window.scrollTo(0,0);
}

function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(window.__toast); window.__toast = setTimeout(function(){ el.classList.remove("show"); }, 1600);
}
function goBack(){ history.back(); }

/* ---------- 初始化 ---------- */
(function init(){
  var sel = document.getElementById("stateSelect");
  sel.innerHTML = stateOrder.map(function(k){ return '<option value="'+esc(k)+'">'+esc(k)+'</option>'; }).join("");
  var hash = decodeURIComponent(location.hash.slice(1));
  setState(STATES[hash] ? hash : DEFAULT_KEY);
  window.addEventListener("hashchange", function(){
    var k = decodeURIComponent(location.hash.slice(1));
    if(STATES[k] && k !== currentKey) setState(k);
  });
})();
</script>
