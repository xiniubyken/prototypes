<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>用户端-批价单-去提货</title>
<!--
  用户端-去提货（设计稿直还原：核心的过程\用户端-去提货：批价单-去提货.png / -勾选.png / 通用-toast.png）
  PC：E:\工作文件\项目\商用工程\20_正式交付\用户端-批价单-去提货.html
  说明：头部(单号+业务标签/项目名同排+有效期日期+三栏统计 数值在上标签在下) + 商品提货清单(勾选+本次提货步进器+可提货/已售罄) + 底部 全选/加入购物车(无勾选置灰)；
  校验 toast：勾选后未填数量→请先为已勾选商品填写本次提货数量；示例数据=PC清单(5项)。
-->
<style>
:root{--blue:#0868d7;--bg:#f5f6f7;--text:#292929;--line:#ececec;--red:#ff5158;--green:#1a9c5c;--amber:#b45309;--safe-bottom:env(safe-area-inset-bottom)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e9edf4;color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}
.phone{width:100%;max-width:428px;min-height:100vh;margin:0 auto;background:var(--bg);overflow:hidden;position:relative;padding-bottom:96px}
.statusbar{height:25px;padding:4px 18px 0;background:#fff;display:flex;align-items:flex-start;justify-content:space-between;font-size:12px;font-weight:700}
.signal{letter-spacing:-2px;font-size:13px}.battery{width:19px;height:9px;border:1.5px solid #222;border-radius:3px;position:relative}
.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#222;border-radius:1px}
.battery:before{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:13px;background:#222;border-radius:1px}
.nav{height:56px;padding:0 10px 0 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;position:relative}
.back{width:34px;height:34px;border:0;background:transparent;display:grid;place-items:center;color:#333}
.back i{width:14px;height:14px;border-left:2px solid #333;border-bottom:2px solid #333;transform:rotate(45deg);display:inline-block}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:19px;font-weight:700;white-space:nowrap}
.hd{background:#fff;padding:12px 16px}
.hd .r1{display:flex;align-items:center;gap:6px;font-size:14px}
.hd .r1 .no{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .r2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px}
.hd .biz{display:inline-block;padding:2px 9px;border-radius:5px;font-size:12px;color:#b45309;background:#fdf6e0;border:1px solid #fde6a8;white-space:nowrap;flex:0 0 auto}
.hd .pname{flex:1;min-width:0;text-align:right;font-size:14px;color:#333;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .eff{margin-top:11px;font-size:13px;color:#666;display:flex;align-items:baseline;gap:2px;flex-wrap:wrap}
.hd .eff .dates{color:#333;font-weight:600}
.hd .cols{display:flex;margin-top:13px}
.hd .col{flex:1;min-width:0}
.hd .col .num{display:block;font-size:18px;font-weight:700;color:#333;line-height:1.15}
.hd .col .num.days{color:var(--amber)}
.hd .col .lbl{display:block;font-size:12px;color:#9aa1ab;margin-top:4px}
.warn{margin:12px 14px 0;display:flex;gap:6px;background:#fffbe6;border:1px solid #ffe58f;border-radius:10px;padding:10px 12px;font-size:12px;color:#8a6100;line-height:1.7}
.scroll{padding:12px 14px 20px}
.sec-title{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;padding:4px 2px 10px}
.sec-title .meta{font-size:13px;color:#8f959e;font-weight:400}
.li{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid #c9ced6;flex:0 0 auto;display:grid;place-items:center;cursor:pointer}
.li.on .ck{border-color:var(--blue);background:var(--blue)}
.li.on .ck:after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.li.disabled{opacity:.65}
.thumb{width:70px;height:70px;border-radius:8px;background:#f2f3f5;display:grid;place-items:center;flex:0 0 auto;overflow:hidden;border:1px solid #eef0f3}
.thumb svg{width:32px;height:32px;color:#c6ccd5}
.main{flex:1;min-width:0}
.l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm .nst{display:inline-block;color:var(--red);background:#ffe7e7;border-radius:3px;font-size:12px;font-weight:400;padding:2px 5px;margin-right:5px}
.l1 .sold{color:#bbb;font-size:12px;font-weight:400;white-space:nowrap}
.sku{font-size:12px;color:#a2a2a2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p{display:flex;gap:14px;margin-top:5px;font-size:13px;color:#444;flex-wrap:wrap}
.p .ap{color:var(--green);font-weight:600}
.p .pickable{color:#333;font-weight:600}
.p .pickable.zero{color:#bbb}
.pickrow{display:flex;align-items:center;justify-content:flex-end;margin-top:9px}
.pickrow .lbl{font-size:12px;color:#8f959e}
.in{width:86px;height:34px;border:1px solid #dfe3ea;border-radius:8px;text-align:center;font-size:15px;outline:none}
.stepper{display:flex;align-items:center;border:1px solid #dfe3ea;border-radius:9px;overflow:hidden;background:#fff;flex:0 0 auto}
.step-btn{width:36px;height:36px;border:0;background:#fff;color:var(--blue);font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.step-btn:disabled{color:#cfd4dc}
.step-val{width:54px;height:36px;border:0;border-left:1px solid #eef0f3;border-right:1px solid #eef0f3;text-align:center;font-size:15px;outline:none;background:#fff}
.step-val:disabled{background:#f4f5f7;color:#a2a2a2}
.add{width:auto;flex:1;min-width:0;border:0;border-radius:17px;background:#eef3fb;color:var(--blue);font-size:13px;font-weight:600;height:34px;padding:0 14px;white-space:nowrap}
.add.done{background:#e8f5e9;color:var(--green)}
.add:disabled{opacity:.5}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(428px,100%);background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-bottom));z-index:30;display:flex;align-items:center;gap:10px}
.all{display:flex;align-items:center;gap:6px;font-size:14px;color:#333;cursor:pointer;white-space:nowrap}
.all .ck{width:20px;height:20px}
.all .ck.on{border-color:var(--blue);background:var(--blue)}
.all .ck.on:after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
.info{flex:1;min-width:0;font-size:13px;color:#666;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{color:#333}
.batch{height:44px;border:0;border-radius:22px;background:var(--blue);color:#fff;font-size:15px;font-weight:700;padding:0 22px}
.batch:disabled{background:#c4cede;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;display:none;z-index:100;white-space:nowrap}
.toast.show{display:block}
@media (min-width:700px){.phone{box-shadow:0 0 28px rgba(0,0,0,.15)}}
</style>
</head>
<body>
<main class="phone">
  <div class="statusbar"><span>9:41</span><span class="status-icons"><span class="signal">▮▮▮</span><span class="wifi" style="font-size:12px">◉</span><span class="battery"></span></span></div>
  <header class="nav"><button class="back" onclick="toast('原型占位：返回批价单详情')" aria-label="返回"><i></i></button><div class="nav-title">批价单-去提货</div></header>
  <div class="hd">
    <div class="r1"><span>批价单</span><span class="no">粤东GCDT202606250001-PJ001</span></div>
    <div class="r2"><span class="biz">中央空调-批价</span><span class="pname">某商业综合体空调项目</span></div>
    <div class="eff"><span>提货有效期：</span><span class="dates">2026-05-30、2026-06-30</span></div>
    <div class="cols">
      <div class="col"><span class="num" id="ship">0</span><span class="lbl">已发货</span></div>
      <div class="col"><span class="num" id="unship">0</span><span class="lbl">未发货</span></div>
      <div class="col"><span class="num days" id="days">24</span><span class="lbl">剩余天数</span></div>
    </div>
  </div>
  <div class="warn"><span>!</span><span>请勾选并在输入框中填写本次需提货的商品数量，点击「加入购物车」后确认提货。</span></div>
  <div class="scroll">
    <div class="sec-title"><span>商品提货清单</span><span class="meta" id="cnt">共 5 项</span></div>
    <div id="list"></div>
  </div>
  <div class="bottom">
    <span class="all" onclick="toggleAll()"><span class="ck" id="allCk"></span>全选</span>
    <span style="flex:1"></span>
    <button class="batch" id="batchBtn" onclick="addCart()">加入购物车</button>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
"use strict";
var ITEMS=[
 {name:"GMV5多联机 10HP",nst:false,cate:"多联机",model:"GMV-450WM/A",sku:"SKU-GMV5-10HP",qty:5,price:42000,approve:40000,pick:10},
 {name:"GMV5多联机 12HP",nst:false,cate:"多联机",model:"GMV-560WM/A",sku:"SKU-GMV5-12HP",qty:3,price:56000,approve:53000,pick:10},
 {name:"定制机-非标控制柜",nst:true,cate:"定制设备",model:"非标-DZ-001",sku:"--",qty:1,price:38000,approve:null,pick:10},
 {name:"GMV5多联机 15HP",nst:false,cate:"多联机",model:"GMV-680WM/A",sku:"SKU-GMV5-15HP",qty:2,price:62000,approve:60000,pick:10},
 {name:"定制机-非标控制柜",nst:true,cate:"定制设备",model:"非标-DZ-002",sku:"--",qty:1,price:38000,approve:null,pick:0}
];
ITEMS.forEach(function(x){x.on=false;x.q="";x.added=false;});
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
function toast(m){var el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(window.__tt);window.__tt=setTimeout(function(){el.classList.remove("show");},1800);}
function money(n){return "¥"+n.toLocaleString();}
function render(){
  document.getElementById("list").innerHTML=ITEMS.map(function(x,i){
    var zero=x.pick<=0;
    return '<div class="li '+(x.on?"on":"")+(zero?"disabled":"")+'">'
      +'<span class="ck" onclick="tick('+i+')"></span>'
      +'<span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M4 17l4.5-4 3 3L16 12l4 4"/></svg></span>'
      +'<div class="main">'
      +'<div class="l1"><span class="nm">'+(x.nst?'<span class="nst">非</span>':"")+esc(x.name)+(zero?' <span class="sold">已售罄</span>':"")+'</span></div>'
      +'<div class="sku">'+esc(x.model)+' · '+esc(x.sku)+'</div>'
      +(zero?'':'<div class="p"><span>申请价格：'+money(x.price)+'</span>'+(x.approve!=null?'<span class="ap">批复价格：'+money(x.approve)+'</span>':'<span>批复价格：待定价</span>')+'</div>')
      +'<div class="p"><span class="pickable '+(zero?"zero":"")+'">可提货数量：'+x.pick+'</span></div>'
      +(zero?'':'<div class="pickrow">'
      +'<span class="stepper"><button class="step-btn" '+((!x.q||parseInt(x.q)<=0)?"disabled":"")+' onclick="step('+i+',-1)">−</button>'
      +'<input class="step-val" type="number" min="0" max="'+x.pick+'" value="'+x.q+'" placeholder="0" oninput="qIn('+i+',this)">'
      +'<button class="step-btn" '+((parseInt(x.q)||0)>=x.pick?"disabled":"")+' onclick="step('+i+',1)">+</button></span>'
      +'</div>')
      +'</div></div></div>';
  }).join("");
  // 统计与按钮态（设计：无勾选→加入购物车置灰）
  var s=0;ITEMS.forEach(function(x){if(x.on)s++;});
  var totalPick=ITEMS.reduce(function(a,x){return a+Math.max(x.pick,0);},0);
  document.getElementById("ship").textContent="0";
  document.getElementById("unship").textContent=totalPick;
  document.getElementById("batchBtn").disabled=s===0;
  document.getElementById("allCk").classList.toggle("on",ITEMS.every(function(x){return x.pick<=0||x.on;}));
}
function tick(i){var x=ITEMS[i];if(x.pick<=0)return;x.on=!x.on;render();}
function toggleAll(){var on=!ITEMS.every(function(x){return x.pick>0&&x.on;});ITEMS.forEach(function(x){if(x.pick>0)x.on=on;});render();}
function qIn(i,inp){var x=ITEMS[i];var v=parseInt(inp.value);if(!isNaN(v)){if(v<0){inp.value=0;v=0;}if(v>x.pick){inp.value=x.pick;v=x.pick;}x.q=String(v);}else{x.q="";}}
function step(i,d){var x=ITEMS[i];if(x.pick<=0)return;var n=parseInt(x.q)||0;n+=d;if(n<0)n=0;if(n>x.pick)n=x.pick;x.q=String(n);render();}
function addCart(){
  var checked=ITEMS.filter(function(x){return x.on;});
  if(!checked.length){return;}
  var total=0;
  for(var i=0;i<checked.length;i++){
    var x=checked[i];
    if(!x.q||parseInt(x.q)<=0){toast("请先为已勾选商品填写本次提货数量");return;}
    total+=Math.min(parseInt(x.q),x.pick);
  }
  toast("原型占位：已加入购物车 "+checked.length+" 项，共 "+total+" 件");
  ITEMS.forEach(function(x){x.on=false;x.q="";x.added=false;});
  render();
}
render();
</script>
</body>
</html>
