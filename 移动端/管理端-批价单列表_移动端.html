   - 风格骨架：20_正式交付\移动端\用户端-批价单列表_移动端.html、用户端-工程项目单列表_移动端.html（仅学其 CSS/布局/状态栏/导航/toast/筛选底弹层写法，未照搬字段）
  用户已拍板决策
   - 输出名：管理端-批价单列表_移动端.html；跳转一律 toast「原型占位：…」，不做真跳转
   - 状态词=「部分提货」（不用「部分待提货」）；状态胶囊=白底彩字 + PC 语义分色，绿/橙/深浅可区分
   - 「作废」按钮仅在 PC 允许作废的状态行显示（部分提货等不可作废时不显示）
   - 筛选=真过滤（面板点确定按条件过滤、点重置恢复）；顶部搜索框按 单号或名称 真过滤
   - 底部固定主按钮「代客申请」=toast 占位；空态文案=「暂无数据」
   - 一字段一行；不新增设计稿没有的字段/按钮；无状态分组 Tab；页面无「状态演示下拉」
  待确认项的默认决定（原则=设计稿优先 + PC 补业务）
   1. T1 状态词统一「部分提货」(4 字)，标签宽度按 4 字处理（用户已拍板）。
   2. T2/T9 两张列表图为同一列表页的不同展示，实现为单列卡片流，不设状态分组 Tab。
   3. T3/T11 部分提货按 PC 不可作废、直接不渲染作废按钮；审批中无审批入口；作废=占位进入「申请作废」流程（设计稿形态=独立申请页而非 PC 弹窗）。
   4. T4 状态标签=白底彩字：审批中#1565C0 / 已驳回#C62828 / 待提货#E65100 / 部分提货#4CAF50 / 已完结#2E7D32 / 已关闭#78909C（已完结与部分提货以深浅绿区分）。
   5. T5 业务线字典采用 PC 4 类（家用空调/商用空调/生活电器/冰箱）；演示行不采用设计稿占位值「中央空调」。
   6. T6 卡片仅展示设计稿 5 个信息字段（批价单号/关联项目单号/业务线/登录顺序/经销商名称）+ 标题=项目名称；不加价格类型/总套数/提货数量/登录时间；销售公司为 PC 业务字段，仅作筛选条件与数据、不上卡片。
   7. T7 顶搜框占位符沿用设计稿「请输入项目单号或项目名称」；匹配范围=批价单号/关联项目单号/项目名称/经销商名称（模糊包含、忽略大小写）。
   8. T8 筛选条件集=设计稿 5 项（批价单号/关联项目单号/经销商名称/项目名称 输入 + 销售公司）+ 批价单状态(可多选,含全部) + 业务线(单选,含全部)；销售公司移动端简化为含「全部」的单选 chips（PC 为多选下拉）；状态组「全部」与具体项互斥（选具体项自动取消全部、点全部清空具体项）。
   9. T10 空态=「暂无数据」；卡片流不搬 PC 分页/自定义配置/共N条等表格元素。
  10. T12 底部「代客申请」=实底蓝固定栏主按钮，点击占位 toast；无任何真跳转。
  演示数据：12 条，覆盖 6 状态（每种 2 条）；业务线 4 类、销售公司 4 家均有分布；可作废行=已驳回 2 条 + 待提货 2 条。
-->

    if(cur.co && d.co!==cur.co)return false;
    if(cur.st.length && cur.st.indexOf(d.status)<0)return false;
    if(cur.biz!=="全部" && d.biz!==cur.biz)return false;
    if(kw){
      var hay=(d.id+" "+d.proj+" "+d.name+" "+d.dealer).toLowerCase();
      if(hay.indexOf(kw)<0)return false;
    }
    return true;
  });
}
function kvHtml(k,v){return '<div class="kv"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span></div>';}
function cardHtml(d,i){
  return '<div class="li" onclick="openCard()">'
    +'<div class="li-hd"><div class="li-name">'+esc(d.name)+'</div>'
    +'<span class="pill '+ST_CLS[d.status]+'">'+esc(d.status)+'</span></div>'
    +'<div class="c-kv">'
    +kvHtml("批价单号",d.id)
    +kvHtml("关联项目单号",d.proj)
    +kvHtml("业务线",d.biz)
    +kvHtml("登录顺序",d.lo)
    +kvHtml("经销商名称",d.dealer)
    +'</div>'
    +(VOIDABLE[d.status]?'<div class="li-act"><button class="act-void" onclick="openVoid(event)">作废</button></div>':"")
    +'</div>';
}
function refresh(){
  var list=filtered();
  var box=document.getElementById("listBox");
  box.innerHTML=list.length?list.map(cardHtml).join(""):'<div class="empty"><svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#c3c9d1" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg><div class="empty-t">暂无数据</div></div>';
  var on=cur.price||cur.proj||cur.dealer||cur.name||cur.co||cur.st.length||cur.biz!=="全部";
  document.getElementById("filBtn").classList.toggle("on",!!on);
}
/* ====== 占位交互 ====== */
function openCard(){toast("原型占位：打开批价单详情");}
function openVoid(e){if(e&&e.stopPropagation)e.stopPropagation();toast("原型占位：申请作废");}
/* ====== 筛选弹层 ====== */
function renderCoPick(){
  document.getElementById("coList").innerHTML=CO_OPTS.map(function(v){
    var on=(v==="全部" && !tmp.co) || v===tmp.co;
    var show=v==="全部"?"请选择":v;
    return '<div class="co-opt '+(on?"on":"")+'" onclick="pickCo(\''+v+'\')"><span>'+esc(show)+'</span><span class="dot"></span></div>';
  }).join("");
  var txt=document.getElementById("fCoText");
  txt.textContent=tmp.co||"请选择";
  txt.classList.toggle("ph",!tmp.co);
}
function renderChips(){
  document.getElementById("fSt").innerHTML=ST_OPTS.map(function(v){
    var on=(v==="全部")?(tmp.st.length===0):(tmp.st.indexOf(v)>=0);
    return '<span class="chip '+(on?"on":"")+'" onclick="pickSt(\''+v+'\')">'+esc(v)+'</span>';
  }).join("");
  document.getElementById("fBiz").innerHTML=BIZ_OPTS.map(function(v){
    return '<span class="chip '+(v===tmp.biz?"on":"")+'" onclick="pickBiz(\''+v+'\')">'+esc(v)+'</span>';
  }).join("");
}
function openFilter(){
  tmp.co=cur.co;tmp.st=cur.st.slice();tmp.biz=cur.biz;
  document.getElementById("fPrice").value=cur.price;
  document.getElementById("fProj").value=cur.proj;
  document.getElementById("fDealer").value=cur.dealer;
  document.getElementById("fName").value=cur.name;
  renderCoPick();
  renderChips();
  document.getElementById("filterMask").classList.add("show");
}
function openCoPick(){renderCoPick();document.getElementById("coMask").classList.add("show");}
function closeCoPick(){document.getElementById("coMask").classList.remove("show");}
function maskCoTap(e){if(e&&e.target===document.getElementById("coMask"))closeCoPick();}
function pickCo(v){tmp.co=(v==="全部"?"":v);renderCoPick();closeCoPick();}
function pickBiz(v){tmp.biz=v;renderChips();}
function pickSt(v){
  if(v==="全部"){tmp.st=[];}
  else{
    var i=tmp.st.indexOf(v);
    if(i>=0){tmp.st.splice(i,1);}
    else{tmp.st.push(v);}
  }
  renderChips();
}
function closeFilter(){document.getElementById("filterMask").classList.remove("show");}
function maskTap(e){if(e&&e.target===document.getElementById("filterMask"))closeFilter();}
function applyFilter(){
  cur.price=(document.getElementById("fPrice").value||"").trim();
  cur.proj=(document.getElementById("fProj").value||"").trim();
  cur.dealer=(document.getElementById("fDealer").value||"").trim();
  cur.name=(document.getElementById("fName").value||"").trim();
  cur.co=tmp.co;cur.st=tmp.st.slice();cur.biz=tmp.biz;
  closeCoPick();closeFilter();refresh();
}
function resetFilter(){
  cur={price:"",proj:"",dealer:"",name:"",co:"",st:[],biz:"全部"};
  tmp={co:"",st:[],biz:"全部"};
  document.getElementById("fPrice").value="";
  document.getElementById("fProj").value="";
  document.getElementById("fDealer").value="";
  document.getElementById("fName").value="";
  renderCoPick();
  renderChips();
  closeFilter();refresh();
}
/* 初始化 */
refresh();
</script>
</body>
</html>
