<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>用户端-工程项目单详情</title>
<!--
  来源说明（可追溯）：
  V1：结构转录自历史已人工验收的对齐记录 + PC HTML；演示数据用 PC 详情页值。
  V2（本次）新增三项，证据 = 新设计稿目录 OCR 文字证据 + PC HTML 对照：
   1) 右上角 ⋯「更多」→「复制新建」：设计稿 通用-更多.png + PC 头部 .more-menu
   2) 设备卡片点击 →「商品详情」弹层（标准/非标两变体）：设计稿 商品详情弹层-标准/非标商品.png + PC 设备清单行字段
   3) 登录顺序「查看」→ 整页跳转（关联工程信息/修改记录 双 tab + 暂无记录空态）：设计稿 登录顺序-关联工程信息/修改记录/通用-暂无记录.png + PC lod-modal 双 tab
  - 规则：设计稿没有的字段/tab/数量/按钮/ico 一律不新增；调试入口与正式视觉分离
-->
<style>
:root{
  --blue:#0868d7;--blue-2:#1168cf;--bg:#f5f5f5;--card:#fff;
  --text:#292929;--sub:#777;--muted:#a4a4a4;--line:#ececec;
  --orange:#ff6b1a;--red:#ff5158;--green:#15b66a;--gray:#9a9a9a;
  --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e9edf4;color:var(--text)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}
button,select{font:inherit}
button{cursor:pointer}
.phone{width:100%;max-width:428px;min-height:100vh;margin:0 auto;background:var(--bg);overflow:hidden;position:relative}
.statusbar{height:25px;padding:4px 18px 0;background:#fff;display:flex;align-items:flex-start;justify-content:space-between;font-size:12px;font-weight:700}
.status-icons{display:flex;gap:5px;align-items:center;font-size:10px}
.signal{letter-spacing:-2px;font-size:13px}.wifi{font-size:12px}
.battery{width:19px;height:9px;border:1.5px solid #222;border-radius:3px;position:relative}
.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#222;border-radius:1px}
.battery:before{content:"";position:absolute;left:1px;top:1px;bottom:1px;width:13px;background:#222;border-radius:1px}
.nav{height:58px;padding:0 10px 0 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.nav-title{position:absolute;left:50%;transform:translateX(-50%);font-size:20px;font-weight:700;white-space:nowrap}
.nav-btn{width:36px;height:36px;border:0;background:transparent;color:#333;display:grid;place-items:center;padding:0}
.back{width:16px;height:16px;border-left:2px solid #333;border-bottom:2px solid #333;transform:rotate(45deg);margin-left:5px}
.summary{background:#fff;padding:16px 18px 14px}
.summary-title{font-size:18px;font-weight:700;line-height:1.35}
.summary-title .label{margin-right:7px}
.summary-tags{display:flex;gap:7px;margin-top:8px;min-height:22px}
.tag{padding:3px 8px;background:#eff2f5;color:#777;font-size:12px;line-height:1;border-radius:3px}
.summary-desc{margin-top:9px;color:#777;font-size:15px;line-height:1.45;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.expiry{padding:11px 18px;background:#fff1df;color:var(--orange);font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{height:57px;display:flex;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:2}
.tab{flex:1;display:flex;align-items:center;justify-content:center;position:relative;color:#aaa;font-size:17px;white-space:nowrap;border:0;background:#fff;padding:0}
.tab.active{color:var(--blue);font-weight:700}
.tab.active:after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:31px;height:4px;background:var(--blue);border-radius:5px}
.content{padding:18px 18px 94px}
.panel{display:none}.panel.active{display:block}
.section{background:var(--card);border-radius:15px;margin-bottom:17px;padding:18px}
.section-title{display:flex;align-items:center;justify-content:space-between;font-size:19px;font-weight:700;line-height:1.3;margin-bottom:16px}
.chevron{width:11px;height:11px;border-right:2px solid #b9b9b9;border-bottom:2px solid #b9b9b9;transform:rotate(45deg);margin:0 3px 6px 0}
.section.collapsed .section-body{display:none}
.section.collapsed .chevron{transform:rotate(225deg);margin:6px 3px 0 0}
.reject-box{margin:0 0 17px;padding:14px 16px;border-radius:14px;background:#ffe7e8;color:var(--red);font-size:14px;line-height:1.55}
.reject-box .time{margin-top:7px}
.equip-list{display:grid;gap:12px}
.equip{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;padding:12px 10px;background:#f6f7f9;border-radius:12px;min-width:0;cursor:pointer}
.equip:active{background:#eef1f5}
.product-img{width:70px;height:70px;border-radius:7px;background:#fff;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.product-img svg{width:34px;height:34px;color:#c9ced6}
.equip-main{min-width:0;position:relative;padding-right:4px}
.equip-name{font-size:16px;font-weight:700;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:16px}
.equip-name .nonstandard{display:inline-block;padding:4px 6px;margin-right:6px;background:#ffe7e7;color:var(--red);border-radius:3px;font-size:14px;font-weight:400;vertical-align:1px}
.equip-sku{margin-top:3px;color:#a2a2a2;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.equip-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:14px}
.qty{color:var(--blue);font-size:16px;font-weight:700}
.go{position:absolute;right:0;top:28px;color:#bbb;font-size:25px;line-height:1}
.totals{border-top:1px solid var(--line);padding-top:13px;display:grid;gap:8px;justify-content:end;text-align:right;color:#777;font-size:15px}
.totals strong{color:#333;font-weight:500}
.totals .amount{color:var(--orange);font-size:17px;font-weight:500}
.kv{display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px 12px;font-size:16px;line-height:1.45}
.kv .k{color:#898989;min-width:0}
.kv .v{min-width:0;word-break:break-word}
.kv .action{color:var(--blue);text-align:right;white-space:nowrap;cursor:pointer}
.kv .row-value{display:flex;justify-content:space-between;gap:8px;min-width:0}
.kv .row-value>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-block{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.sub-block-title{font-size:16px;font-weight:700;margin-bottom:10px}
.file{display:flex;align-items:center;gap:10px;padding:11px 10px;background:#f6f6f6;border-radius:10px;margin-bottom:10px}
.pdf{width:30px;height:34px;border-radius:4px;background:#ff4b4b;color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700;flex:0 0 auto}
.pdf:after{content:"PDF"}
.file-name{flex:1;min-width:0;color:#888;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-action{color:#666;font-size:19px}
.timeline{display:grid;gap:0}
.step{display:grid;grid-template-columns:27px minmax(0,1fr);gap:12px;position:relative;padding:4px 0 22px}
.step:last-child{padding-bottom:4px}
.step:not(:last-child):before{content:"";position:absolute;left:12px;top:29px;bottom:0;width:2px;background:#e3e3e3}
.node{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid #bbb;color:#999;font-size:12px;z-index:1}
.node.done{background:#e9f9f0;border-color:#28b978;color:#16a567}
.node.current{background:#e8f1ff;border-color:var(--blue);color:var(--blue)}
.step-title{display:flex;justify-content:space-between;gap:8px;font-size:16px;font-weight:700}
.step-time{font-size:13px;color:#999;white-space:nowrap}
.step-desc{margin-top:5px;font-size:14px;color:#888;line-height:1.45}
.status-pill{padding:3px 8px;border-radius:4px;background:#e7f0ff;color:var(--blue);font-size:12px;font-weight:700;white-space:nowrap}
.price-card{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}
.price-head{display:flex;justify-content:space-between;gap:10px;font-size:15px;font-weight:700}
.price-status{color:var(--blue);white-space:nowrap}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin-top:12px;font-size:14px;color:#888}
.price-grid span:nth-child(even){text-align:right;color:#333}
.empty{padding:34px 0;text-align:center;color:#aaa}
.footer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(428px,100%);min-height:68px;padding:11px 18px calc(10px + var(--safe-bottom));background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;z-index:30}
.footer-state{border:0;font-family:inherit;cursor:pointer;padding:3px 5px;border-radius:2px;background:#e0efff;color:var(--blue);font-size:16px}
.footer-state.green{background:#dcf8e9;color:#0aaa61}
.footer-state.red{background:#ffe1e2;color:var(--red)}
.footer-state.orange{background:#fff1df;color:#e6650a}
.footer-state.gray{background:#ededed;color:#aaa}
.footer-state.teal{background:#dcf3f1;color:#08999a}
.footer-btn{border:0;min-width:136px;height:46px;border-radius:28px;background:#0864cf;color:#fff;font-size:17px;font-weight:700;padding:0 25px}
.footer-btn.direct{min-width:142px}
.footer-btn:after{content:"⌄";margin-left:8px;font-size:20px}
.footer-btn.no-arrow:after{display:none}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.46);display:none;align-items:flex-end;justify-content:center;z-index:60}
.mask.show{display:flex}
.sheet{width:min(428px,100%);background:#fff;border-radius:17px 17px 0 0;padding:22px 18px calc(17px + var(--safe-bottom));position:relative}
.sheet-close{position:absolute;top:21px;right:19px;border:0;background:transparent;color:#666;font-size:38px;font-weight:200;line-height:1}
.sheet-list{display:grid;gap:13px;padding:51px 35px 0}
.sheet-btn{height:52px;border:0;border-radius:28px;background:#0964ca;color:#fff;font-size:20px;font-weight:700}
.sheet-btn.outline{background:#fff;color:#333;border:2px solid #ddd}
.sheet-btn.danger{color:var(--red);background:#fff1f1;border:1px solid #ffd4d4}
.state-picker{position:fixed;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;z-index:65}
.state-picker.show{display:flex}
.state-picker-box{width:min(428px,100%);background:#fff;border-radius:17px 17px 0 0;padding:18px 18px calc(18px + var(--safe-bottom));max-height:78vh;overflow:auto}
.state-picker-title{font-size:17px;font-weight:700;margin-bottom:12px}
.state-options{display:grid;gap:8px}
.state-option{min-height:42px;padding:9px 12px;border:1px solid #e1e5eb;border-radius:10px;background:#fff;color:#333;text-align:left;font-size:14px}
.state-option.current{border-color:#0964ca;color:#0964ca;background:#f0f6ff;font-weight:700}
.dialog-wrap{position:fixed;inset:0;background:rgba(0,0,0,.44);display:none;align-items:center;justify-content:center;z-index:70;padding:18px}
.dialog-wrap.show{display:flex}
.dialog{width:min(390px,100%);background:#fff;border-radius:15px;overflow:hidden}
.dialog-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;font-size:17px;font-weight:700}
.dialog-close{border:0;background:#f4f4f4;color:#777;border-radius:50%;width:28px;height:28px}
.dialog-body{padding:14px 17px;max-height:65vh;overflow:auto}
.dialog-msg{font-size:15px;line-height:1.7}
.dialog-btns{display:flex;gap:12px;justify-content:center;margin-top:22px}
.dialog-btn{padding:9px 26px;border-radius:24px;font-size:15px;font-weight:700;border:0}
.dialog-btn.cancel{background:#f4f4f4;color:#333}
.dialog-btn.confirm{background:var(--blue);color:#fff}
.order{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.order:last-child{border-bottom:0}
.order .l{color:#888}
.order .r{text-align:right;word-break:break-word}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:9px 14px;border-radius:8px;font-size:13px;display:none;z-index:100}
.toast.show{display:block}
/* ===== V2 新增：右上角更多 / 商品详情弹层 / 登录顺序跳转页 ===== */
.more-ico{width:36px;height:36px;border:0;background:transparent;color:#333;font-size:24px;line-height:1;display:grid;place-items:center;padding:0;cursor:pointer}
.more-menu{position:absolute;right:-4px;top:44px;background:#fff;border-radius:14px;box-shadow:0 5px 22px rgba(0,0,0,.13);min-width:152px;padding:8px 0;display:none;z-index:95}
.more-menu.on{display:block}
.more-menu:before{content:"";position:absolute;right:13px;top:-8px;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:9px solid #fff}
.more-item{width:100%;border:0;background:transparent;color:#333;text-align:center;padding:12px 22px;font-size:17px;cursor:pointer}
.more-item:active{background:#f5f6f8}
#pdMask{background:rgba(0,0,0,.48)}
#pdMask .sheet{background:#f2f3f5;padding:0 0 calc(18px + var(--safe-bottom));border-radius:18px 18px 0 0;max-height:90vh;overflow-y:auto}
#pdMask .sheet-close{top:22px;right:24px}
.pd-card{margin:64px 16px 0;padding:22px 18px 4px;background:#fff;border-radius:16px}
.pd-head{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;margin-bottom:16px}
.pd-img{width:120px;height:120px;border-radius:12px;background:#f6f7f9;display:grid;place-items:center;border:1px solid var(--line)}
.pd-img svg{width:56px;height:56px;color:#c9ced6}
.pd-name{font-size:19px;font-weight:700;line-height:1.4;word-break:break-all}
.pd-cate{display:inline-block;margin-top:8px;padding:3px 10px;background:#eef2fb;color:var(--blue);font-size:13px;border-radius:4px}
.pd-fields{border-top:1px solid var(--line);padding-top:2px}
.pd-row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid #f2f3f5;font-size:16px;line-height:1.5}
.pd-row:last-child{border-bottom:0}
.pd-row .l{color:#8b8b8b;flex:0 0 auto;white-space:nowrap}
.pd-row .l:after{content:"："}
.pd-row .r{text-align:right;word-break:break-word;color:#333;min-width:0}
.pd-row.remark{align-items:flex-start}
.pd-row.remark .r{text-align:left}
.pd-foot{display:flex;justify-content:center;padding:16px 16px 4px}
.pd-ok{width:100%;height:50px;border:0;border-radius:28px;background:#0864cf;color:#fff;font-size:18px;font-weight:700}
.lo-page{position:fixed;top:0;left:50%;transform:translateX(-50%);width:min(428px,100%);height:100%;background:var(--bg);z-index:55;display:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lo-page.show{display:block}
.lo-page .statusbar,.lo-page .nav{position:sticky;top:0}
.lo-scroll{padding:12px 14px 30px}
.lo-summary{background:#fff;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;margin-bottom:12px}
.lo-summary .l{color:#8b8b8b}
.lo-summary .v{font-weight:700;word-break:break-all}
.lo-edit{color:var(--blue);font-size:14px;white-space:nowrap}
.lo-seg{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:12px;gap:4px}
.lo-seg button{flex:1;height:40px;border:0;border-radius:10px;background:transparent;color:#8b8b8b;font-size:15px}
.lo-seg button.active{background:var(--blue);color:#fff;font-weight:700}
.lo-cards{display:grid;gap:12px}
.lo-item{background:#fff;border-radius:14px;padding:14px 16px}
.lo-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lo-badge{display:inline-flex;align-items:center;gap:6px}
.lo-dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;flex:0 0 auto}
.lo-dot.ok{background:#23b571}
.lo-dot.sub{background:#4a90e2}
.lo-tag{font-size:13px;font-weight:600}
.lo-tag.ok{color:#1a9c5c}
.lo-tag.sub{color:#2f7bd6}
.lo-code{font-size:13px;font-weight:600;color:#333}
.lo-kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px 10px;margin-top:12px;font-size:14px;line-height:1.5}
.lo-kv .k{color:#9a9a9a}
.lo-kv .v{color:#333;word-break:break-word}
.mr-list{display:grid;gap:12px}
.mr-item{background:#fff;border-radius:14px;overflow:hidden}
.mr-hd{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;align-items:center}
.mr-main{min-width:0}
.mr-who{font-size:15px;font-weight:700}
.mr-time{color:#9a9a9a;font-size:12px;margin-top:4px}
.mr-remark{color:#555;font-size:14px;margin-top:8px;line-height:1.5;word-break:break-all}
.mr-chev{width:10px;height:10px;border-right:2px solid #b9b9b9;border-bottom:2px solid #b9b9b9;transform:rotate(45deg);flex:0 0 auto;transition:.2s}
.mr-item.open .mr-chev{transform:rotate(225deg)}
.mr-bd{display:none;border-top:1px solid var(--line);padding:14px 16px;background:#fafbfc}
.mr-item.open .mr-bd{display:block}
.mr-seq{margin-bottom:12px}
.mr-seq:last-child{margin-bottom:0}
.mr-seq-title{font-size:13px;font-weight:700;color:#666;margin-bottom:8px}
.mr-seq-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#333;padding:7px 0;border-bottom:1px dashed #eee}
.mr-seq-row:last-child{border-bottom:0}
.mr-seq-row .bdg{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;flex:0 0 auto}
.mr-seq-row .bdg.ok{background:#23b571}
.mr-seq-row .bdg.sub{background:#4a90e2}
.lo-empty{background:#fff;border-radius:14px;padding:60px 0;text-align:center;color:#b5b5b5}
.lo-empty .ico{font-size:46px;margin-bottom:12px;opacity:.55;line-height:1}
/* ===== V5: 审批进度 tab(单据卡片) + 审批流程弹窗 ===== */
.ap-card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ap-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ap-type{font-size:17px;font-weight:700}
.ap-pill{display:inline-block;padding:2px 10px;border-radius:4px;font-size:13px;font-weight:600;white-space:nowrap}
.ap-pill.sp{background:#e3f2fd;color:#1565c0}
.ap-pill.ok{background:#e8f5e9;color:#2e7d32}
.ap-pill.rj{background:#fff3e0;color:#e65100}
.ap-pill.cc{background:#eceff1;color:#546e7a}
.ap-line{display:flex;gap:6px;font-size:14px;line-height:1.8}
.ap-line .l{color:#9a9a9a;flex:0 0 auto}
.ap-line .v{color:#333;min-width:0;word-break:break-all}
.ap-act{display:flex;justify-content:flex-end;gap:20px;margin-top:8px;padding-top:10px;border-top:1px solid #f2f3f5}
.ap-link{color:var(--blue);font-size:14px;cursor:pointer}
.ap-link.rj{color:#e65100}
.ap-empty{background:#fff;border-radius:14px;padding:56px 0;text-align:center;color:#b5b5b5}
#afMask{background:rgba(0,0,0,.5)}
#afMask .sheet{padding:0 0 calc(16px + var(--safe-bottom));border-radius:18px 18px 0 0;max-height:92vh;display:flex;flex-direction:column}
#afMask .sheet-close{top:20px;right:22px}
.af-title{font-size:18px;font-weight:700;text-align:center;padding:20px 16px 12px}
.af-seg{display:flex;margin:0 16px;background:#f2f4f7;border-radius:10px;padding:3px;gap:3px;flex-shrink:0}
.af-seg button{flex:1;height:38px;border:0;border-radius:8px;background:transparent;color:#8b8b8b;font-size:15px}
.af-seg button.active{background:#fff;color:var(--blue);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.af-body{flex:1;overflow-y:auto;padding:14px 16px 8px}
.af-steps{padding:6px 4px 10px}
.af-step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;position:relative;padding:6px 0 18px}
.af-step:last-child{padding-bottom:6px}
.af-step:not(:last-child):before{content:"";position:absolute;left:14px;top:34px;bottom:0;width:2px;background:#e3e6ea}
.af-dot{width:28px;height:28px;border-radius:50%;border:2px solid #c9ced6;background:#fff;display:grid;place-items:center;color:#aab2bd;font-size:12px;font-weight:700}
.af-step.done .af-dot{background:#e9f9f0;border-color:#28b978;color:#16a567}
.af-step.current .af-dot{background:#e8f1ff;border-color:var(--blue);color:var(--blue)}
.af-step-name{font-size:16px;font-weight:600;line-height:1.4}
.af-step-meta{font-size:13px;color:#999;margin-top:3px}
.af-hint{text-align:center;color:#b9b9b9;font-size:13px;padding:2px 0 6px}
.af-node-type{font-size:13px;color:#666;margin:6px 2px 10px}
.af-node{background:#fff;border:1px solid #f0f1f3;border-radius:12px;padding:12px 14px;margin-bottom:10px}
.af-node .n1{font-size:14px;color:#333}
.af-node .n1 b{font-weight:600}
.af-node .n2{font-size:13px;color:#999;margin-top:6px;line-height:1.5}
.af-foot{display:flex;justify-content:center;padding:10px 16px 2px;border-top:1px solid #f2f3f5;flex-shrink:0}
.af-foot .pd-ok{width:70%}
.af-flow{background:#fff;border:1px solid #eef0f3;border-radius:12px;padding:12px 8px 8px;cursor:zoom-in;margin-top:4px}
.af-flow svg{display:block;width:100%;height:auto}
.af-flow-note{text-align:center;color:#b9b9b9;font-size:13px;padding:8px 0 2px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:115;padding:22px}
.zoom.show{display:flex}
.zoom-box{background:#fff;border-radius:14px;padding:14px;max-width:94vw;max-height:86vh;overflow:auto}
.zoom-box svg{display:block;width:min(430px,88vw);height:auto}
.zoom-close{position:absolute;top:14px;right:18px;border:0;background:transparent;color:#fff;font-size:44px;font-weight:200;line-height:1;cursor:pointer}
/* ===== V6: 关联批价单卡片 ===== */
.pj-card{background:#fff;border-radius:14px;margin-bottom:14px;overflow:hidden}
.pj-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid #f3f4f6}
.pj-id{font-size:15px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.pj-right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.pj-arrow{color:#c3c8d0;font-size:18px;cursor:pointer}
.pj-rows{padding:12px;display:grid;gap:8px}
.pj-row{display:flex;align-items:center;gap:11px;padding:11px 12px;background:#f6f7f9;border-radius:12px;cursor:pointer}
.pj-mini{width:46px;height:46px;border-radius:9px;background:#f6f7f9;border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.pj-mini svg{width:22px;height:22px;color:#c9ced6}
.pj-main{flex:1;min-width:0}
.pj-r1{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pj-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-name .cate{color:#999;font-weight:400;margin-right:6px}
.pj-count{font-size:14px;color:var(--blue);font-weight:700;white-space:nowrap}
.pj-sku{font-size:13px;color:#a2a2a2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.pj-price .v{color:#e6650a;font-weight:600}

    ? apl.map(apCardHtml).join("")
    : '<div class="ap-empty">暂无记录</div>';

  // 关联批价单（批价单卡片，随状态）
  var rel = REL_CARDS[currentKey] || [];
  var rl = document.getElementById("priceList");
  if(rl){ rl.innerHTML = rel.length ? rel.map(pjCardHtml).join("") : '<div class="ap-empty">暂无关联批价单</div>'; }

  // 底部操作栏
  var fs = document.getElementById("footerState");
  fs.textContent = s.status;
  fs.style.background = sc[0];
  fs.style.color = sc[1];
  var fb = document.getElementById("footerButton");
  if(s.noFooter){ fb.style.display="none"; }
  else if(s.actions && s.actions.length){ fb.textContent="操作"; fb.className="footer-btn"; fb.style.display="block"; }
  else if(s.sd){ fb.textContent=s.sd; fb.className="footer-btn direct no-arrow"; fb.style.display="block"; }
  else { fb.style.display="none"; }

  // 调试下拉
  document.getElementById("stateSelect").value = currentKey;

  // 重置折叠（默认都展开）
  document.querySelectorAll(".section").forEach(function(el){ el.classList.remove("collapsed"); });
}

function kvRow(k, v, fn){
  var val = fn ? '<div class="row-value"><span>'+esc(v)+'</span><span class="action" onclick="'+fn+'()">'+actionLabel(fn)+'</span></div>' : '<div class="v">'+esc(v)+'</div>';
  return '<div class="k">'+esc(k)+'</div>'+val;
}
function actionLabel(fn){ return fn==="doCopy" ? "复制" : (fn==="doOrder" ? "查看" : ""); }
function doCopy(){ toast("已复制"); }
function doOrder(){ showLoPage(); }

/* ---------- V5: 审批进度卡片 + 审批流程弹窗 ---------- */
function apPillCls(st){ return st==="审批中"?"sp":(st==="通过"?"ok":(st==="驳回"?"rj":"cc")); }
function apCardHtml(a){
  // 业务规则：仅「登录审批」驳回的单据提供「重新提交」；其它类型只给「审批流程」
  var canResub = (a.type==="登录审批" && a.status==="驳回");
  var act = '<span class="ap-link" onclick="openAf(\''+a.type+'\')">审批流程</span>';
  if(canResub) act = '<span class="ap-link rj" onclick="toast(\'原型占位：重新提交\')">重新提交</span>' + act;
  return '<div class="ap-card">'
    + '<div class="ap-hd"><span class="ap-type">'+esc(a.type)+'</span><span class="ap-pill '+apPillCls(a.status)+'">'+esc(a.status)+'</span></div>'
    + '<div class="ap-line"><span class="l">更新时间：</span><span class="v">'+esc(a.updated)+'</span></div>'
    + '<div class="ap-line"><span class="l">创建时间：</span><span class="v">'+esc(a.created)+'</span></div>'
    + '<div class="ap-act">'+act+'</div></div>';
}
function afStepHtml(x){
  var mark = x[3]==="done" ? "✓" : (x[3]==="current" ? "···" : "");
  return '<div class="af-step '+(x[3]||"")+'"><span class="af-dot">'+mark+'</span>'
    + '<div><div class="af-step-name">'+esc(x[0])+'</div><div class="af-step-meta">'+esc(x[1]||"")+(x[2]?' · '+esc(x[2]):"")+'</div></div></div>';
}
function afFlowSvg(){
  var nodes=[
    {t:"经销商提交",c:"#28b978",st:"完成"},
    {t:"办事处内勤",c:"#0868d7",st:"当前"},
    {t:"工程科内勤",c:"#c9ced6",st:""},
    {t:"销司主管",c:"#c9ced6",st:""}
  ];
  var H = nodes.length*96 + 20;
  var p=['<svg viewBox="0 0 300 '+H+'" xmlns="http://www.w3.org/2000/svg"><defs><marker id="afArr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#ccd2da"/></marker></defs>'];
  nodes.forEach(function(n,i){
    var y=8+i*96;
    p.push('<rect x="62" y="'+y+'" width="176" height="54" rx="10" fill="#fff" stroke="'+n.c+'" stroke-width="2"/>');
    p.push('<text x="150" y="'+(y+22)+'" text-anchor="middle" font-size="13" fill="#333" font-weight="600">'+n.t+'</text>');
    if(n.st){ p.push('<text x="150" y="'+(y+41)+'" text-anchor="middle" font-size="11" fill="'+n.c+'">'+n.st+'</text>'); }
    if(i<nodes.length-1){ p.push('<line x1="150" y1="'+(y+54)+'" x2="150" y2="'+(y+84)+'" stroke="#ccd2da" stroke-width="2" marker-end="url(#afArr)"/>'); }
  });
  p.push('</svg>');
  return p.join("");
}
function openAf(type){
  document.getElementById("afTitle").textContent = "审批流程"+(type?"·"+type:"");
  // 设计稿：流程图以“占位图”呈现，点击可放大
  document.getElementById("afFlowBody").innerHTML =
    '<div class="af-flow" onclick="openZoom()">'+afFlowSvg()+'<div class="af-flow-note">流程图占位图 · 点击可放大</div></div>';
  document.getElementById("afNodeBody").innerHTML = '<div class="af-node-type">节点类型：岗位</div>'
    + AF_NODES.map(function(n){
      return '<div class="af-node"><div class="n1">岗位编号 <b>'+esc(n.code)+'</b> · 岗位名称：'+esc(n.name)+'</div><div class="n2">'+esc(n.emp)+'</div></div>';
    }).join("");
  afTab(document.querySelector('#afMask [data-aft="flow"]'), "flow");
  document.getElementById("afMask").classList.add("show");
}
function openZoom(){
  document.getElementById("zoomBody").innerHTML = afFlowSvg();
  document.getElementById("zoomWrap").classList.add("show");
}
function closeZoom(e){
  var z = document.getElementById("zoomWrap");
  if(e && e.target !== z && e.target.id !== "zoomClose") return;
  z.classList.remove("show");
}
function closeAf(e){ if(e && e.target !== document.getElementById("afMask")) return; document.getElementById("afMask").classList.remove("show"); }
function afTab(btn, which){
  document.querySelectorAll("#afMask .af-seg button").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  document.getElementById("afFlowBody").style.display = which==="flow" ? "" : "none";
  document.getElementById("afNodeBody").style.display = which==="node" ? "" : "none";
}

function fileHtml(name){ return '<div class="file"><span class="pdf"></span><span class="file-name">'+esc(name)+'</span><span class="file-action" onclick="toast(\'原型占位：预览文件\')">◉</span></div>'; }

function renderExtra(type){
  if(type==="bid") return '<div class="sub-block"><div class="sub-block-title">中标信息</div><div style="color:#888;font-size:14px;margin-bottom:8px">中标通知书</div>'+fileHtml("中标通知书_XX商业综合体.pdf")+'</div>';
  if(type==="sign") return '<div class="sub-block"><div class="sub-block-title">中标信息</div><div style="color:#888;font-size:14px;margin-bottom:8px">中标通知书</div>'+fileHtml("中标通知书_XX商业综合体.pdf")+'</div><div class="sub-block"><div class="sub-block-title">签单信息</div><div style="color:#888;font-size:14px;margin-bottom:8px">合同附件</div>'+fileHtml("合同附件_XX商业综合体.pdf")+'<div class="kv" style="margin-top:12px"><div class="k">合同客户</div><div class="v">XX商业管理有限公司</div><div class="k">签单金额</div><div class="v">¥480,000</div></div></div>';
  if(type==="lost") return '<div class="sub-block"><div class="sub-block-title">丢标信息</div><div class="kv"><div class="k">丢单原因</div><div class="v">价格原因</div><div class="k">丢单报告</div><div class="v">'+fileHtml("丢单报告_XX商业综合体.pdf")+'</div></div></div>';
  if(type==="complete") return '<div class="sub-block"><div class="sub-block-title">完结信息</div><div class="kv"><div class="k">完结说明</div><div class="v">项目已完工，所有设备已交付并完成验收</div><div class="k">验收报告</div><div class="v">'+fileHtml("验收报告_XX商业综合体.pdf")+'</div><div class="k">竣工验收文件</div><div class="v">'+fileHtml("竣工验收文件_XX商业综合体.pdf")+'</div></div></div>';
  return "";
}

/* ---------- 交互 ---------- */
function switchPanel(id, el){
  document.querySelectorAll(".tab").forEach(function(x){ x.classList.remove("active"); });
  document.querySelectorAll(".panel").forEach(function(x){ x.classList.remove("active"); });
  el.classList.add("active");
  document.getElementById(id+"Panel").classList.add("active");
  window.scrollTo(0,0);
}
function toggleSection(id){ document.getElementById(id).classList.toggle("collapsed"); }

function handleFooter(){
  var s = current();
  if(s.actions && s.actions.length){ openMore(); return; }
  if(s.sd){ showAbd(); return; }
}
function openMore(){
  var s = current();
  var items = s.actions.slice();
  var html = items.map(function(a){
    var cls = a==="放弃登录" ? "outline" : (a==="重新提交" ? "danger" : "");
    return '<button class="sheet-btn '+cls+'" onclick="doAction(\''+a+'\')">'+a+'</button>';
  }).join("");
  if(s.sd) html += '<button class="sheet-btn outline" onclick="showAbd()">放弃登录</button>';
  document.getElementById("sheetList").innerHTML = html;
  document.getElementById("sheetMask").classList.add("show");
}
function closeSheet(e){ if(e && e.target !== document.getElementById("sheetMask")) return; document.getElementById("sheetMask").classList.remove("show"); }
function doAction(a){ closeSheet(); if(a==="放弃登录"){ showAbd(); return; } toast("原型占位："+a); }

function openStatePicker(){
  document.getElementById("stateOptions").innerHTML = stateOrder.map(function(k){
    return '<button class="state-option '+(k===currentKey?"current":"")+'" onclick="setState(\''+k.replace(/'/g,"\\'")+'\')">'+esc(k)+'</button>';
  }).join("");
  document.getElementById("statePicker").classList.add("show");
}
function closeStatePicker(e){ if(e && e.target !== document.getElementById("statePicker")) return; document.getElementById("statePicker").classList.remove("show"); }

/* ---------- V2: 右上角更多 ---------- */
function toggleMoreMenu(e){
  if(e){ e.stopPropagation(); }
  document.getElementById("moreMenu").classList.toggle("on");
}
function closeMoreMenu(){ document.getElementById("moreMenu").classList.remove("on"); }
function doCopyNew(){ closeMoreMenu(); toast("原型占位：复制新建项目单"); }
document.addEventListener("click", function(e){
  var m = document.getElementById("moreMenu");
  if(!m || !m.classList.contains("on")) return;
  if(e.target.closest && e.target.closest("#moreMenu")) return;
  if(e.target.id === "moreNavBtn") return;
  m.classList.remove("on");
});

/* ---------- V2: 商品详情弹层 ---------- */
var PD_IMG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="15" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M4 17l4.5-4 3 3L16 12l4 4"/></svg>';
function openPd(i){
  var p = baseProducts[i];
  if(!p) return;
  var rows = [
    ["SKU编码", p.sku],
    ["商品ID", p.id],
    ["型号", p.model],
    ["申请数量", p.qtyVal],
    ["申请价格", p.price],
    ["申请点位", p.point]
  ];
  var html = '<div class="pd-card">'
    + '<div class="pd-head">'
    + '<div class="pd-img">'+PD_IMG+'</div>'
    + '<div style="min-width:0"><div class="pd-name">'+esc(p.name)+'</div><span class="pd-cate">'+esc(p.cate)+'</span></div>'
    + '</div>'
    + '<div class="pd-fields">'
    + rows.map(function(r){ return '<div class="pd-row"><span class="l">'+esc(r[0])+'</span><span class="r">'+esc(r[1])+'</span></div>'; }).join("")
    + '<div class="pd-row remark"><span class="l">备注</span><span class="r">'+esc(p.remark)+'</span></div>'
    + '</div>'
    + '</div>'
    + '<div class="pd-foot"><button class="pd-ok" onclick="closePd()">确定</button></div>';
  document.getElementById("pdBody").innerHTML = html;
  document.getElementById("pdMask").classList.add("show");
}
function closePd(e){ if(e && e.target !== document.getElementById("pdMask")) return; document.getElementById("pdMask").classList.remove("show"); }

/* ---------- V2: 登录顺序跳转页 ---------- */
function seqRowHtml(r){
  return '<div class="lo-item"><div class="lo-top">'
    + '<span class="lo-badge"><span class="lo-dot '+(r.kind==="ok"?"ok":"sub")+'">'+r.num+'</span><span class="lo-tag '+(r.kind==="ok"?"ok":"sub")+'">'+esc(r.tag)+'</span></span>'
    + '<span class="lo-code">'+esc(r.code)+'</span>'
    + '</div>'
    + '<div class="lo-kv">'
    + '<div class="k">经销商名称</div><div class="v">'+esc(r.dealer)+'</div>'
    + '<div class="k">工程状态</div><div class="v">'+esc(r.st)+'</div>'
    + '<div class="k">登录时间</div><div class="v">'+esc(r.t)+'</div>'
    + '<div class="k">业务经理</div><div class="v">'+esc(r.mgr)+'</div>'
    + '</div></div>';
}
function loEmptyHtml(){
  return '<div class="lo-empty"><div class="ico">'
    + '<svg viewBox="0 0 48 48" width="46" height="46" fill="none" stroke="#c9ced6" stroke-width="2.6" aria-hidden="true"><path d="M10 4h20l10 10v28a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M30 4v10h10"/><path d="M14 26h20M14 34h14"/></svg>'
    + '</div>暂无记录</div>';
}
function showLoPage(){
  document.getElementById("loRelPanel").innerHTML = LO_REL.length ? LO_REL.map(seqRowHtml).join("") : loEmptyHtml();
  document.getElementById("loModPanel").innerHTML = LO_MOD.length ? LO_MOD.map(modHtml).join("") : loEmptyHtml();
  document.getElementById("loPage").classList.add("show");
  document.getElementById("loPage").scrollTop = 0;
}
function hideLoPage(){ document.getElementById("loPage").classList.remove("show"); }
function loTab(btn, which){
  document.querySelectorAll(".lo-seg button").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  document.getElementById("loRelPanel").style.display = which==="rel" ? "" : "none";
  document.getElementById("loModPanel").style.display  = which==="mod" ? "" : "none";
}
function modHtml(m){
  return '<div class="mr-item'+(m.open?" open":"")+'">'
    + '<div class="mr-hd" onclick="mrToggle(this)">'
    + '<div class="mr-main"><div class="mr-who">'+esc(m.who)+'</div><div class="mr-time">'+esc(m.time)+'</div><div class="mr-remark">'+esc(m.remark)+'</div></div>'
    + '<span class="mr-chev"></span></div>'
    + '<div class="mr-bd">'
    + seqBlockHtml("原顺序", m.before)
    + seqBlockHtml("修改后顺序", m.after)
    + '</div></div>';
}
function seqBlockHtml(title, list){
  return '<div class="mr-seq"><div class="mr-seq-title">'+esc(title)+'</div>'
    + list.map(function(x){ return '<div class="mr-seq-row"><span class="bdg '+(x.kind==="ok"?"ok":"sub")+'">'+x.num+'</span><span class="lo-tag '+(x.kind==="ok"?"ok":"sub")+'">'+(x.kind==="ok"?"登录成功":"候补登录")+'</span><span>'+esc(x.code)+'</span></div>'; }).join("")
    + '</div>';
}
function mrToggle(hd){ hd.closest(".mr-item").classList.toggle("open"); }

/* ---------- 放弃登录 / 状态切换 ---------- */
function showAbd(){ document.getElementById("abdDialog").classList.add("show"); }
function closeAbd(e){ if(e && e.target !== document.getElementById("abdDialog")) return; document.getElementById("abdDialog").classList.remove("show"); }
function confirmAbd(){ closeAbd(); toast("原型占位：已确认放弃登录（演示，真实将进入已关闭流程）"); }

function setState(key){
  if(!STATES[key]) key = "跟进中";
  currentKey = key;
  closeStatePicker();
  closeSheet();
  closePd();
  closeAf();
  closeMoreMenu();
  hideLoPage();
  document.getElementById("stateSelect").value = key;
  if(location.hash !== "#"+encodeURIComponent(key)){ history.replaceState(null,"","#"+encodeURIComponent(key)); }
  render();
  window.scrollTo(0,0);
}

function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(window.__toast); window.__toast = setTimeout(function(){ el.classList.remove("show"); }, 1500);
}
function goBack(){ history.back(); }

/* ---------- 初始化 ---------- */
(function init(){
  var sel = document.getElementById("stateSelect");
  sel.innerHTML = stateOrder.map(function(k){ return '<option value="'+esc(k)+'">'+esc(k)+'</option>'; }).join("");
  var hash = decodeURIComponent(location.hash.slice(1));
  setState(STATES[hash] ? hash : "跟进中");
  window.addEventListener("hashchange", function(){
    var k = decodeURIComponent(location.hash.slice(1));
    if(STATES[k] && k !== currentKey) setState(k);
  });
})();
</script>
</body>
</html>
