<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理端-作废审批页_查看版</title>
<style>
/* 商用工程 · 共享样式 */
:root{
  --primary:#3b5998; --primary-light:#4a72c3;
  --danger:#D32F2F; --success:#2E7D32; --warning:#ED6C02; --info:#0288D1;
  --bg:#fff; --bg-card:#fff; --bg-header:#F7F8FA; --bg-hover:#f0f2f5;
  --border:#e8eaed; --border-light:#f0f0f0;
  --text:#1f2329; --text-secondary:#646a73; --text-aux:#8f959e;
  --font-body:14px; --font-card-title:14px; --font-aux:12px; --font-small:13px;
  --radius:4px; --radius-card:6px;
  --gap:4px; --gap8:8px; --gap12:12px; --gap16:16px; --gap24:24px;
  --row-h:36px; --header-h:40px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:var(--font-body);color:var(--text);background:#f0f2f5;line-height:1.6;}

html,body{height:100%;margin:0;overflow:hidden;}
.page-root{display:flex;flex-direction:column;height:100%;background:#f0f2f5;overflow:hidden;}

/* ====== 页面头 ====== */
.form-page-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 12px;background:#fff;border-bottom:1px solid #e8eaed;position:sticky;top:0;z-index:50;}
.form-page-title{font-size:17px;font-weight:700;color:#1f2329;}
.form-header-right{display:flex;align-items:center;gap:16px;font-size:12px;color:#8f959e;}
.back-btn{display:flex;align-items:center;gap:5px;font-size:13px;color:#646a73;cursor:pointer;padding:5px 10px;border-radius:4px;border:1px solid #e8eaed;background:#fff;transition:.15s;margin-right:8px;}
.back-btn:hover{color:#3b5998;border-color:#3b5998;}
.back-btn svg{width:14px;height:14px;}

/* 状态badge */
.status-badge{padding:3px 12px;border-radius:4px;font-size:12px;font-weight:700;white-space:nowrap;}
.status-badge.ok{background:#E8F5E9;color:#2E7D32;}
.status-badge.rj{background:#FFF3E0;color:#E65100;}

/* 项目单号显示 */
.proj-no-display{font-size:13px;color:#646a73;background:#f5f6fa;padding:4px 10px;border-radius:4px;}

/* ====== 滚动内容区 ====== */
.form-page-scroll{flex:1;overflow-y:auto;background:#f0f2f5;}
.form-page-inner{padding:16px 24px 0 24px;}

/* ====== 表单卡片 ====== */
.form-card{background:#fff;border:1px solid #e8eaed;border-radius:6px;margin-bottom:12px;overflow:hidden;}
.form-card-header{padding:11px 16px;font-size:14px;font-weight:700;border-bottom:1px solid #f0f0f0;background:#f7f8fa;display:flex;align-items:center;justify-content:space-between;}
.form-card-title{display:flex;align-items:center;gap:8px;}
.form-card-title .fct-accent{width:4px;height:16px;background:#C62828;border-radius:2px;flex-shrink:0;}
.form-card-title .fct-text{font-size:14px;font-weight:700;color:#1f2329;}
.form-card-body{padding:16px;}

/* ====== 只读字段 ====== */
.field-readonly{font-size:13px;color:#1f2329;display:flex;align-items:center;gap:6px;}

/* ====== 审批记录表格 ====== */
.record-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:auto;}
.record-table th{background:#fafbfc;height:38px;padding:8px 10px;text-align:left;font-weight:600;font-size:12px;color:#646a73;border-bottom:1px solid #e8eaed;white-space:nowrap;}
.record-table td{height:42px;padding:6px 10px;border-bottom:1px solid #f0f0f0;font-size:12px;color:#1f2329;vertical-align:middle;}
.record-table .td-center{text-align:left;}

/* 审批状态标签 */
.st-ok{display:inline-block;font-size:12px;padding:1px 8px;border-radius:3px;background:#e8f8ea;color:#2E7D32;border:1px solid #a5d6a7;}
.st-rej{display:inline-block;font-size:12px;padding:1px 8px;border-radius:3px;background:#fce8e6;color:#D32F2F;border:1px solid #ef9a9a;}

/* 无附件标记 */
.no-attach-tag{color:#c5cae9;font-size:12px;}

/* ====== Toast ====== */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:6px;font-size:14px;color:#fff;z-index:2000;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.toast.success{background:var(--success);}
.toast.error{background:var(--danger);}

/* ====== 附件列表（只读） ====== */
.attach-list{display:flex;flex-direction:column;gap:6px;}
.attach-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f5f6fa;border-radius:4px;font-size:12px;color:var(--text-secondary);}
.attach-item .at-icon{flex-shrink:0;width:16px;height:16px;display:flex;align-items:center;justify-content:center;}
.attach-item .at-name{flex:1;color:var(--primary);cursor:pointer;font-size:13px;}
.attach-item .at-name:hover{text-decoration:underline;}
.attach-item .at-size{color:var(--text-aux);font-size:11px;}
</style>
</head>
<body>
<div class="page-root">

<!-- ===== 页面头部 ===== -->
<div class="form-page-header">
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="back-btn" onclick="goBack()">
      <svg viewBox="0 0 14 14" fill="none"><path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回
    </div>
    <span class="form-page-title">查看-省外跨区登录</span>
    <span class="proj-no-display">粤东GCDT202506250001 (希望小学A项目)</span>
  </div>
  <div class="form-header-right">
  </div>
</div>

<!-- ===== 滚动内容区 ===== -->
<div class="form-page-scroll">
<div class="form-page-inner">

  <!-- ===== 作废申请信息卡片 ===== -->
  <div class="form-card">
    <div class="form-card-header">
      <div class="form-card-title">
        <div class="fct-accent"></div>
        <span class="fct-text">作废申请信息</span>
      </div>
    </div>
    <div class="form-card-body">
      <div style="display:flex;flex-direction:column;gap:14px;">
        <!-- 作废原因 -->
        <div style="display:flex;align-items:flex-start;gap:8px;">
          <span style="font-size:12px;color:#646a73;width:84px;flex-shrink:0;line-height:32px;">作废原因</span>
          <div class="field-readonly" style="line-height:1.6;">因客户方项目规划调整，希望小学A项目不再推进，经与代理商沟通确认，申请作废此工程单。相关解除协议已附后。</div>
        </div>
        <!-- 附件 -->
        <div style="display:flex;align-items:flex-start;gap:8px;">
          <span style="font-size:12px;color:#646a73;width:84px;flex-shrink:0;line-height:32px;">附件</span>
          <div class="attach-list" style="flex:1;">
            <div class="attach-item">
              <span class="at-icon">📄</span>
              <span class="at-name" onclick="showToast('预览：解除协议.pdf','success')">解除协议.pdf</span>
              <span class="at-size">1.2MB</span>
            </div>
            <div class="attach-item">
              <span class="at-icon">📄</span>
              <span class="at-name" onclick="showToast('预览：客户通知邮件.png','success')">客户通知邮件.png</span>
              <span class="at-size">340KB</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 审批记录卡片 ===== -->
  <div class="form-card">
    <div class="form-card-header">
      <div class="form-card-title">
        <div class="fct-accent" style="background:var(--info);"></div>
        <span class="fct-text">审批记录</span>
      </div>
    </div>
    <div class="form-card-body">
      <table class="record-table">
        <colgroup>
          <col style="width:44px;">
          <col style="width:auto;">
          <col style="width:auto;">
          <col style="width:auto;">
          <col style="width:auto;">
          <col style="width:auto;">
        </colgroup>
        <thead>
          <tr>
            <th style="text-align:center;">序号</th>
            <th>审批人</th>
            <th>审批状态</th>
            <th>审批意见</th>
            <th>附件</th>
            <th>审批时间</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="text-align:center;color:#8f959e;">1</td>
            <td>张三（商用工程部）</td>
            <td><span class="st-ok">通过</span></td>
            <td>资料齐全，同意发起作废流程。</td>
            <td><span class="no-attach-tag">—</span></td>
            <td>2026-06-26 10:30</td>
          </tr>
          <tr>
            <td style="text-align:center;color:#8f959e;">2</td>
            <td>李四（粤东大区）</td>
            <td><span class="st-ok">通过</span></td>
            <td>同意作废，客户已确认。</td>
            <td><span class="no-attach-tag">—</span></td>
            <td>2026-06-28 15:22</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div style="height:24px;"></div>
</div><!-- /form-page-inner -->
</div><!-- /form-page-scroll -->

<!-- ===== Toast通知 ===== -->
<div class="toast" id="toast"></div>

</div><!-- /page-root -->

<script>
/* ===== Toast ===== */
function showToast(msg, type) {
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = 'toast ' + (type || 'success');
  toast.style.display = 'block';
  setTimeout(function() {
    toast.style.display = 'none';
  }, 3000);
}

/* ===== 返回 ===== */
function goBack() {
  showToast('返回列表页','success');
}
</script>
</body>
</html>
